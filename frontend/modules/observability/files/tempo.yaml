target: all
stream_over_http_enabled: true
server:
  http_listen_port: 3200
distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
storage:
  trace:
    backend: local
    wal:
      path: /data/wal
    local:
      path: /data/blocks
usage_report:
  reporting_enabled: false
backend_scheduler:
  provider:
    compaction:
      compaction:
        block_retention: 72h
