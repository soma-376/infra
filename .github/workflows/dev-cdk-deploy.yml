name: Dev CDK Deploy

on:
  workflow_dispatch: {}
  push:
    branches: [develop]
    paths:
      - 'bin/**'
      - 'lib/common/**'
      - 'lib/dev/**'
      - 'config/dev/deployment.json'
      - 'config/dev/runtime.yaml'
      - 'scripts/backend-image-inputs.mjs'
      - 'scripts/dev-generated-values*.mjs'
      - 'scripts/validate-generated-values.mjs'
      - 'scripts/generated-values-github.mjs'
      - 'scripts/eks-values.mjs'
      - 'scripts/dev-cdk-pipeline.mjs'
      - 'scripts/dev-cdk-pipeline.cjs'
      - 'test/dev/**'
      - 'test/helpers.ts'
      - 'test/scripts/dev-cdk-pipeline.test.ts'
      - 'test/scripts/backend-image-inputs.test.ts'
      - 'test/scripts/dev-generated-values*.test.ts'
      - 'test/scripts/validate-generated-values.test.ts'
      - 'test/scripts/fixtures/backend-image-publication.json'
      - 'test/workflows/dev-cdk.test.ts'
      - 'package*.json'
      - 'cdk.json'
      - 'tsconfig.json'
      - 'jest.config.js'
      - '.github/workflows/dev-cdk-*.yml'

permissions:
  contents: read

# plan·승인 대기·deploy·사본 게시 전체를 직렬화하며 실행 중 배포를 취소하지 않는다.
concurrency:
  group: infra-dev-cloudformation-deploy
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  plan:
    # 수동 재계획도 develop의 동일 승인 경로만 사용한다.
    if: github.repository == 'soma-376/infra' && github.ref == 'refs/heads/develop' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: infra-dev-plan
    permissions:
      contents: read
      id-token: write
    outputs:
      plan_sha256: ${{ steps.plan.outputs.plan_sha256 }}
      plan_artifact_id: ${{ steps.upload.outputs.artifact-id }}
      generated_values_enabled: ${{ steps.plan.outputs.generated_values_enabled }}
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      CDK_DIFF_ROLE_ARN: ${{ vars.CDK_DIFF_ROLE_ARN }}
      GENERATED_VALUES_SYNC_ENABLED: ${{ vars.GENERATED_VALUES_SYNC_ENABLED }}
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - name: 결과 디렉터리 준비
        run: mkdir -p "$RUNNER_TEMP/dev-cdk-plan/logs"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: 의존성 준비
        run: npm ci 2>&1 | tee "$RUNNER_TEMP/dev-cdk-plan/logs/npm-ci.log"
      - name: TypeScript 검증
        run: npm run build 2>&1 | tee "$RUNNER_TEMP/dev-cdk-plan/logs/build.log"
      - name: 고정 Helm 준비
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/helm"
          cd "$RUNNER_TEMP/helm"
          curl --fail --silent --show-error --location --retry 3 \
            https://get.helm.sh/helm-v3.22.0-linux-amd64.tar.gz \
            -o helm-v3.22.0-linux-amd64.tar.gz
          echo '1e4ab49e429626cf6c6958d914248b78c9730803c2751b87627e171dc800e7bb  helm-v3.22.0-linux-amd64.tar.gz' | sha256sum --check
          tar -xzf helm-v3.22.0-linux-amd64.tar.gz
          echo "HELM_BIN=$RUNNER_TEMP/helm/linux-amd64/helm" >> "$GITHUB_ENV"
      - name: CDK·배포 경계 검증
        run: npm test -- --runInBand test/dev test/prod test/cicd test/scripts/dev-cdk-pipeline.test.ts test/scripts/backend-image-inputs.test.ts test/scripts/dev-generated-values-inputs.test.ts test/scripts/dev-generated-values-sync.test.ts test/scripts/validate-generated-values.test.ts test/helm/values-reader-rbac.test.ts test/workflows/dev-cdk.test.ts 2>&1 | tee "$RUNNER_TEMP/dev-cdk-plan/logs/tests.log"
      - name: 역할 입력 확인
        run: |
          test -n "$AWS_ACCOUNT_ID"
          test -n "$CDK_DIFF_ROLE_ARN"
      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: ${{ env.CDK_DIFF_ROLE_ARN }}
          aws-region: ap-northeast-2
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          role-duration-seconds: 3600
          role-session-name: infra-dev-plan-${{ github.run_id }}
      - name: backend 로그 조회 token 발급
        id: backend-token
        if: vars.GENERATED_VALUES_SYNC_ENABLED == 'true'
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.GENERATED_VALUES_APP_ID }}
          private-key: ${{ secrets.GENERATED_VALUES_APP_PRIVATE_KEY }}
          owner: soma-376
          repositories: pulsemetry-backend
          permission-actions: read
          permission-contents: read
      - name: 최신 develop의 읽기 전용 계획
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          BACKEND_GH_TOKEN: ${{ steps.backend-token.outputs.token }}
        run: node scripts/dev-cdk-pipeline.mjs plan --directory "$RUNNER_TEMP/dev-cdk-plan"
      - name: 승인할 계획 보관
        id: upload
        if: success() && steps.plan.outputs.plan_sha256 != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dev-cdk-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/dev-cdk-plan/plan.json
            ${{ runner.temp }}/dev-cdk-plan/payload
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: workflow 결과 보완
        if: always()
        env:
          WORKFLOW_JOB_STATUS: ${{ job.status }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const directory = path.join(process.env.RUNNER_TEMP, 'dev-cdk-plan');
          fs.mkdirSync(path.join(directory, 'logs'), { recursive: true });
          const result = path.join(directory, 'result-workflow.json');
          fs.writeFileSync(result, JSON.stringify({ phase: 'workflow', status: process.env.WORKFLOW_JOB_STATUS }, null, 2) + '\n');
          if (!fs.readdirSync(directory).some(name => /^result-(plan|deploy)\.json$/.test(name))) {
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### dev CDK plan\n\n계획 시작 전 결과: ${process.env.WORKFLOW_JOB_STATUS}\n`);
          }
          NODE
      - name: 계획 실행 결과 보관
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dev-cdk-plan-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/dev-cdk-plan/logs
            ${{ runner.temp }}/dev-cdk-plan/result*.json
          if-no-files-found: error
          retention-days: 14

  deploy:
    needs: plan
    if: needs.plan.outputs.plan_sha256 != '' && needs.plan.outputs.plan_artifact_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 75
    # 관리자가 develop 전용·필수 reviewer·자기 승인 방지·보호 우회 차단을 설정한다.
    environment: infra-dev-deploy
    permissions:
      contents: read
      id-token: write
    outputs:
      receipt_sha256: ${{ steps.deploy.outputs.receipt_sha256 }}
      receipt_artifact_id: ${{ steps.receipt.outputs.artifact-id }}
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      CDK_DEPLOY_ROLE_ARN: ${{ vars.CDK_DEPLOY_ROLE_ARN }}
      AWS_EC2_METADATA_DISABLED: 'true'
      PLAN_SHA256: ${{ needs.plan.outputs.plan_sha256 }}
      PLAN_ARTIFACT_ID: ${{ needs.plan.outputs.plan_artifact_id }}
      DOWNLOADED_ARTIFACT_ID: ${{ needs.plan.outputs.plan_artifact_id }}
    steps:
      - name: 결과 디렉터리 준비
        run: mkdir -p "$RUNNER_TEMP/dev-cdk-plan/logs"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: 의존성 준비
        run: npm ci 2>&1 | tee "$RUNNER_TEMP/dev-cdk-plan/logs/npm-ci.log"
      - name: 같은 실행의 승인 대상 가져오기
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.plan.outputs.plan_artifact_id }}
          path: ${{ runner.temp }}/dev-cdk-plan
          merge-multiple: true
      - name: AWS 인증 전 계획·파일 무결성 검사
        run: node scripts/dev-cdk-pipeline.mjs verify --directory "$RUNNER_TEMP/dev-cdk-plan"
      - name: 역할 입력 확인
        run: |
          test -n "$AWS_ACCOUNT_ID"
          test -n "$CDK_DEPLOY_ROLE_ARN"
      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: ${{ env.CDK_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          role-duration-seconds: 3600
          role-session-name: infra-dev-deploy-${{ github.run_id }}
      - name: 승인한 Assembly 배포
        id: deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/dev-cdk-pipeline.mjs deploy --directory "$RUNNER_TEMP/dev-cdk-plan"
      - name: 성공 배포 receipt 보관
        id: receipt
        if: success() && steps.deploy.outputs.receipt_sha256 != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dev-cdk-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dev-cdk-plan/deployment-receipt.json
          if-no-files-found: error
          retention-days: 14
      - name: workflow 결과 보완
        if: always()
        env:
          WORKFLOW_JOB_STATUS: ${{ job.status }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const directory = path.join(process.env.RUNNER_TEMP, 'dev-cdk-plan');
          fs.mkdirSync(path.join(directory, 'logs'), { recursive: true });
          const result = path.join(directory, 'result-workflow.json');
          fs.writeFileSync(result, JSON.stringify({ phase: 'workflow', status: process.env.WORKFLOW_JOB_STATUS }, null, 2) + '\n');
          if (!fs.readdirSync(directory).some(name => /^result-(plan|deploy)\.json$/.test(name))) {
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### dev CDK deploy\n\n배포 시작 전 결과: ${process.env.WORKFLOW_JOB_STATUS}\n`);
          }
          NODE
      - name: 배포 실행 결과 보관
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dev-cdk-deploy-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/dev-cdk-plan/logs
            ${{ runner.temp }}/dev-cdk-plan/result*.json
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [plan, deploy]
    # 승인 당시 활성화한 사본만 게시한다. 현재 vars 값으로 승인 입력을 뒤집지 않는다.
    if: needs.plan.outputs.generated_values_enabled == 'true' && needs.deploy.result == 'success' && needs.deploy.outputs.receipt_sha256 != '' && needs.deploy.outputs.receipt_artifact_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: infra-dev-deploy
    permissions:
      contents: read
      id-token: write
      actions: read
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      CDK_DEPLOY_ROLE_ARN: ${{ vars.CDK_DEPLOY_ROLE_ARN }}
      AWS_EC2_METADATA_DISABLED: 'true'
      PLAN_SHA256: ${{ needs.plan.outputs.plan_sha256 }}
      PLAN_ARTIFACT_ID: ${{ needs.plan.outputs.plan_artifact_id }}
      DOWNLOADED_ARTIFACT_ID: ${{ needs.plan.outputs.plan_artifact_id }}
      RECEIPT_SHA256: ${{ needs.deploy.outputs.receipt_sha256 }}
      RECEIPT_ARTIFACT_ID: ${{ needs.deploy.outputs.receipt_artifact_id }}
    steps:
      - name: 정제된 결과 디렉터리 준비
        run: mkdir -p "$RUNNER_TEMP/dev-cdk-plan"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: 의존성 준비
        run: npm ci
      - name: 원본 승인 plan 가져오기
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.plan.outputs.plan_artifact_id }}
          path: ${{ runner.temp }}/dev-cdk-plan
          merge-multiple: true
      - name: 성공 배포 receipt 가져오기
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.deploy.outputs.receipt_artifact_id }}
          path: ${{ runner.temp }}/dev-cdk-plan
          merge-multiple: true
      - name: AWS 인증 전 원본 승인·배포 증거 검사
        run: node scripts/dev-cdk-pipeline.mjs verify-publish --directory "$RUNNER_TEMP/dev-cdk-plan"
      - name: 고정 Helm 준비
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/helm"
          cd "$RUNNER_TEMP/helm"
          curl --fail --silent --show-error --location --retry 3 \
            https://get.helm.sh/helm-v3.22.0-linux-amd64.tar.gz \
            -o helm-v3.22.0-linux-amd64.tar.gz
          echo '1e4ab49e429626cf6c6958d914248b78c9730803c2751b87627e171dc800e7bb  helm-v3.22.0-linux-amd64.tar.gz' | sha256sum --check
          tar -xzf helm-v3.22.0-linux-amd64.tar.gz
          echo "HELM_BIN=$RUNNER_TEMP/helm/linux-amd64/helm" >> "$GITHUB_ENV"
      - name: 고정 Session Manager plugin 준비
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/session-manager-plugin"
          cd "$RUNNER_TEMP/session-manager-plugin"
          # AWS 공식 1.2.896.0 패키지의 서명을 signer 7959637124CE093AD501D47A2C4D4AFF6F6757EE로 검증한 hash다.
          # https://docs.aws.amazon.com/systems-manager/latest/userguide/install-plugin-linux-verify-signature.html
          curl --fail --silent --show-error --location --retry 3 \
            https://s3.amazonaws.com/session-manager-downloads/plugin/1.2.896.0/ubuntu_64bit/session-manager-plugin.deb \
            -o session-manager-plugin.deb
          echo '53f51fcc67314a4bf85888a38a3967cd41f8d0f28a60a9469a63acf935ba713e  session-manager-plugin.deb' | sha256sum --check
          sudo dpkg -i session-manager-plugin.deb
          test "$(session-manager-plugin --version)" = '1.2.896.0'
      - name: 역할 입력 확인
        run: |
          test -n "$AWS_ACCOUNT_ID"
          test -n "$CDK_DEPLOY_ROLE_ARN"
      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: ${{ env.CDK_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          role-duration-seconds: 3600
          role-session-name: infra-dev-values-${{ github.run_id }}
      - name: private 사본 게시 token 발급
        id: values-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.GENERATED_VALUES_APP_ID }}
          private-key: ${{ secrets.GENERATED_VALUES_APP_PRIVATE_KEY }}
          owner: soma-376
          repositories: infra-generated-values
          permission-contents: write
      - name: 승인 이미지와 현재 metadata로 사본 게시
        env:
          GH_TOKEN: ${{ github.token }}
          VALUES_GH_TOKEN: ${{ steps.values-token.outputs.token }}
        run: node scripts/dev-generated-values-sync.mjs --directory "$RUNNER_TEMP/dev-cdk-plan"
      - name: 사본 workflow 결과 보완
        if: always()
        env:
          WORKFLOW_JOB_STATUS: ${{ job.status }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const directory = path.join(process.env.RUNNER_TEMP, 'dev-cdk-plan');
          fs.mkdirSync(directory, { recursive: true });
          fs.writeFileSync(path.join(directory, 'result-publish-workflow.json'), JSON.stringify({ phase: 'publish', status: process.env.WORKFLOW_JOB_STATUS }, null, 2) + '\n');
          if (!fs.existsSync(path.join(directory, 'result-publish.json'))) {
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### dev generated values\n\n사본 시작 전 결과: ${process.env.WORKFLOW_JOB_STATUS}\n`);
          }
          NODE
      - name: 정제된 사본 결과만 보관
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dev-generated-values-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/dev-cdk-plan/result-publish.json
            ${{ runner.temp }}/dev-cdk-plan/result-publish-workflow.json
          if-no-files-found: error
          retention-days: 14
