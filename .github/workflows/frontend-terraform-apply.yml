name: Frontend Terraform Apply

on:
  push:
    branches: [develop, main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-terraform-*.yml'

permissions:
  contents: read

# 같은 환경의 적용은 취소하지 않고 직렬화한다.
concurrency:
  group: frontend-apply-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false
      - run: bash frontend/scripts/check.sh

  apply:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 75
    # 이 Environment에서 승인과 허용 브랜치를 강제한다.
    environment: ${{ github.ref_name == 'main' && 'frontend-prod-apply' || 'frontend-dev-apply' }}
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: 'true'
      AWS_EC2_METADATA_DISABLED: 'true'
      TF_VAR_aws_account_id: ${{ vars.AWS_ACCOUNT_ID }}
      STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      ROLE_ARN: ${{ vars.TF_APPLY_ROLE_ARN }}
    defaults:
      run:
        working-directory: frontend/environments/${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false
      - name: 설정과 최신 커밋 확인
        run: |
          test -n "$TF_VAR_aws_account_id"
          test -n "$STATE_BUCKET"
          test -n "$ROLE_ARN"
          test "$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)" = "$GITHUB_SHA"
      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ap-northeast-2
          allowed-account-ids: ${{ env.TF_VAR_aws_account_id }}
          role-session-name: frontend-apply-${{ github.run_id }}
      - name: 머지된 코드의 최종 계획
        run: |
          terraform init -input=false -lockfile=readonly \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config="allowed_account_ids=[\"$TF_VAR_aws_account_id\"]"
          terraform plan -input=false -lock-timeout=5m -out=frontend.tfplan
      - name: 같은 계획 적용
        run: |
          test "$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)" = "$GITHUB_SHA"
          terraform apply -input=false -lock-timeout=5m frontend.tfplan
      - name: 로컬 계획 제거
        if: always()
        run: rm -f frontend.tfplan
