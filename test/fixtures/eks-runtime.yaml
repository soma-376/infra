# 비밀 원문 없는 로컬 검증 전용 입력이다. 실제 운영 수치가 아니다.
userAuth:
  privateVersionId: 11111111-1111-4111-8111-111111111111
  publicVersionId: 22222222-2222-4222-8222-222222222222
  activeKid: release-2026.10
  publicKeys:
    - kid: release-2026.10
      alias: release-2026-10.pem
  issuer: https://issuer.example.invalid
  audience: pulsemetry-dev
  allowedOrigins:
    - https://dashboard.example.invalid
# telemetry 전용 JWT 원본의 VersionId·kid 맵이다. issueEnabled는 공개키 선배포 뒤에만 true로 바꾼다.
telemetryJwt:
  privateVersionId: 33333333-3333-4333-8333-333333333333
  publicVersionId: 44444444-4444-4444-8444-444444444444
  activeKid: telemetry-2026.10
  publicKeys:
    - kid: telemetry-2026.10
      alias: telemetry-2026-10.pem
  issueEnabled: false
# ValidationOtlpTarget output과 호환돼야 한다. ingest 대상이면 http|dual, gateway 대상이면 dual|kafka다.
ingestMode: http
dashboard:
  managementEnabled: false
  mailEnabled: false
  settings:
    PULSEMETRY_DASHBOARD_RETRY_AFTER: 5s
    PULSEMETRY_DASHBOARD_CLICKHOUSE_SOURCE_QUERY_TIMEOUT: 20s
    PULSEMETRY_DASHBOARD_CLICKHOUSE_CACHE_QUERY_TIMEOUT: 10s
    PULSEMETRY_DASHBOARD_CLICKHOUSE_SOURCE_MAX_RESULT_ROWS: '100000'
    PULSEMETRY_DASHBOARD_CLICKHOUSE_SOURCE_MAX_RESULT_BYTES: '10485760'
    PULSEMETRY_DASHBOARD_SNAPSHOT_BUILD_TIMEOUT: 60s
    PULSEMETRY_DASHBOARD_SNAPSHOT_MAX_CONCURRENT_BUILDS: '1'
    PULSEMETRY_DASHBOARD_SNAPSHOT_MAX_COPY_ROWS: '100000'
    PULSEMETRY_DASHBOARD_SNAPSHOT_MAX_COPY_BYTES: '10485760'
    PULSEMETRY_DASHBOARD_SNAPSHOT_PURGE_GRACE: 1h
    PULSEMETRY_DASHBOARD_SNAPSHOT_CLEANUP_INTERVAL: 5m
    PULSEMETRY_DASHBOARD_INGEST_WINDOW: 5m
    PULSEMETRY_DASHBOARD_INGEST_DELAYED_AFTER: 5m
    PULSEMETRY_DASHBOARD_INGEST_DOWN_AFTER: 15m
    PULSEMETRY_DASHBOARD_COMPLETENESS_SETTLE_AFTER: 10m
    PULSEMETRY_DASHBOARD_MEMBERS_IDLE_DAYS: '14'
    PULSEMETRY_DASHBOARD_SEATS_STALE_AFTER: 1d
    PULSEMETRY_DASHBOARD_ALERTS_EVALUATION_INTERVAL: 1m
    PULSEMETRY_DASHBOARD_ALERTS_LEASE: 2m
