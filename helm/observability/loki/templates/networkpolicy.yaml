{{- /* 수신만 제한한다(ADR-0039). 송신·DNS는 막지 않는다. 허용 송신자는 values의 networkPolicy.ingress이고 검증기가 실제 Pod label과 대조한다. */ -}}
{{- with .Values.networkPolicy }}
{{- if .enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      {{- toYaml .podSelector | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    {{- range .ingress }}
    {{- if not .from }}{{ fail "NetworkPolicy 규칙에는 송신자가 있어야 한다. 빈 from은 모두 허용이다" }}{{- end }}
    - from:
        {{- range .from }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ required "송신자 namespace" .namespace }}
          podSelector:
            matchLabels:
              {{- toYaml (required "송신자 podLabels" .podLabels) | nindent 14 }}
        {{- end }}
      {{- with .ports }}
      ports:
        {{- range . }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
      {{- end }}
    {{- end }}
{{- end }}
{{- end }}
