{{- include "pulsemetry.observability.validate" . -}}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: grafana-admin
  namespace: {{ .Release.Namespace }}
spec:
  provider: aws
  parameters:
    region: {{ .Values.global.pulsemetry.region | quote }}
    usePodIdentity: "true"
    objects: |
      - objectName: {{ .Values.global.pulsemetry.grafanaAdminSecretArn | quote }}
        objectType: secretsmanager
        jmesPath:
          - path: password
            objectAlias: admin-password
            filePermission: "0444"
