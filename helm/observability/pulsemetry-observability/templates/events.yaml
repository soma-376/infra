# Kubernetes Events는 노드별 복제 수집하지 않는다. 단일 replica + 영속 이벤트 중복 제거 DB를 사용한다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubernetes-events
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pulsemetry-observability-events
rules:
  - apiGroups: [""]
    resources: [events]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pulsemetry-observability-events
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pulsemetry-observability-events
subjects:
  - kind: ServiceAccount
    name: kubernetes-events
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kubernetes-events-state
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  storageClassName: {{ .Values.events.storageClass | quote }}
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.events.storageSize | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubernetes-events
  namespace: {{ .Release.Namespace }}
data:
  fluent-bit.conf: |
{{ include "pulsemetry.events.config" . | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-events
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kubernetes-events
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubernetes-events
      annotations:
        checksum/config: {{ include "pulsemetry.events.config" . | sha256sum }}
    spec:
      serviceAccountName: kubernetes-events
      nodeSelector:
        kubernetes.io/arch: arm64
        pulsemetry.io/workload: observability
      tolerations:
        - key: workload
          operator: Equal
          value: observability
          effect: NoSchedule
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fluent-bit
          image: {{ .Values.events.image | quote }}
          args: ["-c", "/fluent-bit/custom/fluent-bit.conf"]
          env:
            - name: AWS_REGION
              value: {{ .Values.global.pulsemetry.region | quote }}
          ports:
            - name: metrics
              containerPort: 2020
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet: {path: /, port: metrics}
          livenessProbe:
            httpGet: {path: /, port: metrics}
          volumeMounts:
            - name: config
              mountPath: /fluent-bit/custom
              readOnly: true
            - name: state
              mountPath: /var/lib/fluent-bit
      volumes:
        - name: config
          configMap:
            name: kubernetes-events
        - name: state
          persistentVolumeClaim:
            claimName: kubernetes-events-state
---
apiVersion: v1
kind: Service
metadata:
  name: kubernetes-events
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: kubernetes-events
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kubernetes-events
  ports:
    - name: metrics
      port: 2020
      targetPort: metrics
