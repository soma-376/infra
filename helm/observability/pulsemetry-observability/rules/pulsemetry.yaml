groups:
  - name: pulsemetry.recording
    interval: 10s
    rules:
      - record: pulsemetry:gateway_requests:rate1m
        expr: sum by (environment, cluster, namespace, service, pod, signal, outcome) (rate(pulsemetry_gateway_requests_total[1m]))
      - record: pulsemetry:gateway_latency:p95
        expr: histogram_quantile(0.95, sum by (environment, cluster, namespace, service, pod, signal, le) (rate(pulsemetry_gateway_request_duration_seconds_bucket[1m])))
      - record: pulsemetry:gateway_latency:p99
        expr: histogram_quantile(0.99, sum by (environment, cluster, namespace, service, pod, signal, le) (rate(pulsemetry_gateway_request_duration_seconds_bucket[1m])))
      - record: pulsemetry:pipeline_attempts:rate1m
        expr: sum by (environment, cluster, namespace, service, pod, signal, outcome) (rate(pulsemetry_pipeline_attempts_total[1m]))
      - record: pulsemetry:pipeline_stage:p95
        expr: histogram_quantile(0.95, sum by (environment, cluster, namespace, service, pod, stage, outcome, le) (rate(pulsemetry_pipeline_stage_duration_seconds_bucket[1m])))
      - record: pulsemetry:pipeline_completion:p95
        expr: histogram_quantile(0.95, sum by (environment, cluster, namespace, service, pod, signal, le) (rate(pulsemetry_pipeline_accepted_to_completion_seconds_bucket[1m])))
      # msk-jmx는 60초 간격이라 rate 범위는 표본 4개 이상인 5분이다.
      - record: pulsemetry:msk_messages:rate5m
        expr: sum by (environment, cluster, msk_cluster, topic) (rate(kafka_server_BrokerTopicMetrics_Count{job="msk-jmx",name="MessagesInPerSec",topic!=""}[5m]))
      # 예정된 scrape 중 성공한 비율이다. target이 사라지면 표본이 없어 값도 없다(성공률 0과 다르다).
      - record: pulsemetry:msk_scrape_success:ratio15m
        expr: avg by (environment, cluster, msk_cluster, job, instance) (avg_over_time(up{job=~"msk-jmx|msk-node"}[15m]))
      - record: pulsemetry:clickhouse_inserted_rows:rate1m
        expr: sum by (environment, cluster, namespace, service, pod) (rate(ClickHouseProfileEvents_InsertedRows{job="clickhouse"}[1m]))
  # last_success는 성공한 scrape의 표본 시각이다(timestamp(up == 1)은 rule 평가 시각을 돌려준다).
  # 구성요소별 수집 상태다. 2 정상, 1 일부 실패(또는 기대 target 수 미달), 0 전체 실패, -1 대상 없음(배포·설정 필요),
  # -2 최근 수신 없음(k6 실행 없음 또는 remote-write 미연결)이다. 빈값을 0으로 덮지 않고 상태를 별도 값으로 둔다.
  - name: pulsemetry.collection
    interval: 10s
    rules:
      - record: pulsemetry:collection_state
        expr: |
          max(
            (min(up{job="telemetry-gateway"}) == 1) * 2
              or (max(up{job="telemetry-gateway"}) == 1) * 0 + 1
              or max(up{job="telemetry-gateway"}) * 0
              or absent(up{job="telemetry-gateway"}) * -1
          )
        labels:
          component: telemetry-gateway
          dashboard: pulsemetry-gateway
      - record: pulsemetry:collection_success:ratio
        expr: avg(up{job="telemetry-gateway"})
        labels:
          component: telemetry-gateway
          dashboard: pulsemetry-gateway
      - record: pulsemetry:collection_last_success:timestamp
        expr: max(timestamp(up{job="telemetry-gateway"}) and up{job="telemetry-gateway"} == 1)
        labels:
          component: telemetry-gateway
          dashboard: pulsemetry-gateway
      - record: pulsemetry:collection_state
        expr: |
          max(
            (min(up{job="telemetry-ingest"}) == 1) * 2
              or (max(up{job="telemetry-ingest"}) == 1) * 0 + 1
              or max(up{job="telemetry-ingest"}) * 0
              or absent(up{job="telemetry-ingest"}) * -1
          )
        labels:
          component: telemetry-ingest
          dashboard: pulsemetry-pipeline
      - record: pulsemetry:collection_success:ratio
        expr: avg(up{job="telemetry-ingest"})
        labels:
          component: telemetry-ingest
          dashboard: pulsemetry-pipeline
      - record: pulsemetry:collection_last_success:timestamp
        expr: max(timestamp(up{job="telemetry-ingest"}) and up{job="telemetry-ingest"} == 1)
        labels:
          component: telemetry-ingest
          dashboard: pulsemetry-pipeline
      - record: pulsemetry:collection_state
        expr: |
          max(
            (min(up{job="clickhouse"}) == 1) * 2
              or (max(up{job="clickhouse"}) == 1) * 0 + 1
              or max(up{job="clickhouse"}) * 0
              or absent(up{job="clickhouse"}) * -1
          )
        labels:
          component: clickhouse
          dashboard: pulsemetry-clickhouse
      - record: pulsemetry:collection_success:ratio
        expr: avg(up{job="clickhouse"})
        labels:
          component: clickhouse
          dashboard: pulsemetry-clickhouse
      - record: pulsemetry:collection_last_success:timestamp
        expr: max(timestamp(up{job="clickhouse"}) and up{job="clickhouse"} == 1)
        labels:
          component: clickhouse
          dashboard: pulsemetry-clickhouse
      - record: pulsemetry:collection_state
        expr: |
          max(
            (min(up{job="msk-jmx"}) == 1 and count(up{job="msk-jmx"}) == 3) * 2
              or (max(up{job="msk-jmx"}) == 1) * 0 + 1
              or max(up{job="msk-jmx"}) * 0
              or absent(up{job="msk-jmx"}) * -1
          )
        labels:
          component: msk-jmx
          dashboard: pulsemetry-msk
      - record: pulsemetry:collection_success:ratio
        expr: avg(up{job="msk-jmx"})
        labels:
          component: msk-jmx
          dashboard: pulsemetry-msk
      - record: pulsemetry:collection_last_success:timestamp
        expr: max(timestamp(up{job="msk-jmx"}) and up{job="msk-jmx"} == 1)
        labels:
          component: msk-jmx
          dashboard: pulsemetry-msk
      - record: pulsemetry:collection_state
        expr: |
          max(
            (min(up{job="msk-node"}) == 1 and count(up{job="msk-node"}) == 3) * 2
              or (max(up{job="msk-node"}) == 1) * 0 + 1
              or max(up{job="msk-node"}) * 0
              or absent(up{job="msk-node"}) * -1
          )
        labels:
          component: msk-node
          dashboard: pulsemetry-msk
      - record: pulsemetry:collection_success:ratio
        expr: avg(up{job="msk-node"})
        labels:
          component: msk-node
          dashboard: pulsemetry-msk
      - record: pulsemetry:collection_last_success:timestamp
        expr: max(timestamp(up{job="msk-node"}) and up{job="msk-node"} == 1)
        labels:
          component: msk-node
          dashboard: pulsemetry-msk
      - record: pulsemetry:collection_state
        expr: |
          max(
            (min(up{job="fluent-bit"}) == 1) * 2
              or (max(up{job="fluent-bit"}) == 1) * 0 + 1
              or max(up{job="fluent-bit"}) * 0
              or absent(up{job="fluent-bit"}) * -1
          )
        labels:
          component: fluent-bit
          dashboard: pulsemetry-health
      - record: pulsemetry:collection_success:ratio
        expr: avg(up{job="fluent-bit"})
        labels:
          component: fluent-bit
          dashboard: pulsemetry-health
      - record: pulsemetry:collection_last_success:timestamp
        expr: max(timestamp(up{job="fluent-bit"}) and up{job="fluent-bit"} == 1)
        labels:
          component: fluent-bit
          dashboard: pulsemetry-health
      - record: pulsemetry:collection_state
        expr: |
          max(
            (min(up{job="kubernetes-events"}) == 1) * 2
              or (max(up{job="kubernetes-events"}) == 1) * 0 + 1
              or max(up{job="kubernetes-events"}) * 0
              or absent(up{job="kubernetes-events"}) * -1
          )
        labels:
          component: kubernetes-events
          dashboard: pulsemetry-health
      - record: pulsemetry:collection_success:ratio
        expr: avg(up{job="kubernetes-events"})
        labels:
          component: kubernetes-events
          dashboard: pulsemetry-health
      - record: pulsemetry:collection_last_success:timestamp
        expr: max(timestamp(up{job="kubernetes-events"}) and up{job="kubernetes-events"} == 1)
        labels:
          component: kubernetes-events
          dashboard: pulsemetry-health
      # Loki·Tempo·플랫폼 Collector(ADR-0039).
      - record: pulsemetry:collection_state
        expr: |
          max(
            (min(up{job="loki"}) == 1) * 2
              or (max(up{job="loki"}) == 1) * 0 + 1
              or max(up{job="loki"}) * 0
              or absent(up{job="loki"}) * -1
          )
        labels:
          component: loki
          dashboard: pulsemetry-diagnostics
      - record: pulsemetry:collection_success:ratio
        expr: avg(up{job="loki"})
        labels:
          component: loki
          dashboard: pulsemetry-diagnostics
      - record: pulsemetry:collection_last_success:timestamp
        expr: max(timestamp(up{job="loki"}) and up{job="loki"} == 1)
        labels:
          component: loki
          dashboard: pulsemetry-diagnostics
      - record: pulsemetry:collection_state
        expr: |
          max(
            (min(up{job="tempo"}) == 1) * 2
              or (max(up{job="tempo"}) == 1) * 0 + 1
              or max(up{job="tempo"}) * 0
              or absent(up{job="tempo"}) * -1
          )
        labels:
          component: tempo
          dashboard: pulsemetry-traces
      - record: pulsemetry:collection_success:ratio
        expr: avg(up{job="tempo"})
        labels:
          component: tempo
          dashboard: pulsemetry-traces
      - record: pulsemetry:collection_last_success:timestamp
        expr: max(timestamp(up{job="tempo"}) and up{job="tempo"} == 1)
        labels:
          component: tempo
          dashboard: pulsemetry-traces
      - record: pulsemetry:collection_state
        expr: |
          max(
            (min(up{job="otel-platform"}) == 1) * 2
              or (max(up{job="otel-platform"}) == 1) * 0 + 1
              or max(up{job="otel-platform"}) * 0
              or absent(up{job="otel-platform"}) * -1
          )
        labels:
          component: otel-platform
          dashboard: pulsemetry-traces
      - record: pulsemetry:collection_success:ratio
        expr: avg(up{job="otel-platform"})
        labels:
          component: otel-platform
          dashboard: pulsemetry-traces
      - record: pulsemetry:collection_last_success:timestamp
        expr: max(timestamp(up{job="otel-platform"}) and up{job="otel-platform"} == 1)
        labels:
          component: otel-platform
          dashboard: pulsemetry-traces
      # k6는 scrape 대상이 아니라 remote-write로 들어온다. 최근 5분 표본 유무만 판단한다.
      - record: pulsemetry:collection_state
        expr: max(group(k6_http_reqs_total) * 2 or absent(k6_http_reqs_total) * -2)
        labels:
          component: k6
          dashboard: pulsemetry-overview
      - record: pulsemetry:collection_last_success:timestamp
        expr: max(timestamp(k6_http_reqs_total))
        labels:
          component: k6
          dashboard: pulsemetry-overview
  - name: pulsemetry.alerts
    interval: 10s
    rules:
      # Loki·Tempo·플랫폼 Collector(ADR-0039). 업무 수집 경로와 분리돼 있어 warning이다.
      - alert: PlatformLogTraceStoreUnavailable
        expr: |
          absent(up{job="loki"}) or absent(up{job="tempo"}) or absent(up{job="otel-platform"})
            or (up{job=~"loki|tempo|otel-platform"} == 0)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Loki·Tempo·플랫폼 trace Collector 중 수집할 수 없는 구성요소가 있다
      - alert: PlatformTraceQueueHigh
        expr: max by (cluster) (otelcol_exporter_queue_size{job="otel-platform"} / otelcol_exporter_queue_capacity{job="otel-platform"}) > 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 플랫폼 trace 전송 queue가 80퍼센트 이상 찼다
      - alert: PlatformTraceSpansRefused
        expr: sum by (cluster) (increase(otelcol_receiver_refused_spans{job="otel-platform"}[10m])) > 0
        labels:
          severity: warning
        annotations:
          summary: 플랫폼 trace Collector가 span을 거부했다
      - alert: GatewayMetricsUnavailable
        expr: absent(up{job="telemetry-gateway"}) or (up{job="telemetry-gateway"} == 0)
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Gateway 지표를 수집할 수 없다
      - alert: PipelineMetricsUnavailable
        expr: absent(up{job="telemetry-ingest"}) or (up{job="telemetry-ingest"} == 0)
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Pipeline 지표를 수집할 수 없다
      - alert: ClickHouseMetricsUnavailable
        expr: absent(up{job="clickhouse"}) or (up{job="clickhouse"} == 0)
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: ClickHouse 지표를 수집할 수 없다
      # 60초 간격에서 429 한 번은 up=0이 1분 유지된다. 연속 3회 실패부터 경보하고 간헐 실패는 성공률 패널로 본다.
      - alert: MskJmxTargetSetIncomplete
        expr: (count(up{job="msk-jmx"}) != 3) or absent(up{job="msk-jmx"}) or (up{job="msk-jmx"} == 0)
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: MSK broker 3개의 JMX 수집을 확인할 수 없다
      - alert: MskNodeTargetSetIncomplete
        expr: (count(up{job="msk-node"}) != 3) or absent(up{job="msk-node"}) or (up{job="msk-node"} == 0)
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: MSK broker 3개의 node 수집을 확인할 수 없다
      - alert: MskUnderReplicatedPartitions
        expr: max by (cluster) (kafka_server_ReplicaManager_Value{job="msk-jmx",name="UnderReplicatedPartitions"}) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: MSK under-replicated partition이 지속된다
      # Backend는 두 counter를 실패 전부터 0으로 노출하지만, 새 Pod가 첫 scrape 전에 실패하면 series가 1 이상으로 처음 보인다.
      # increase()는 그 첫 값을 세지 못하므로 최근 5분 안에 생긴 series의 값도 본다. counter > 0 단독은 과거 실패를 계속 울린다.
      # Prometheus 수집이 5분 넘게 끊겼다 돌아오면 이미 0보다 큰 series가 새로 보여 5분 동안 한 번 울릴 수 있다.
      - alert: PipelineRetryExhausted
        expr: |
          sum(increase(pulsemetry_pipeline_retry_exhausted_total[5m])) > 0
            or sum(pulsemetry_pipeline_retry_exhausted_total unless pulsemetry_pipeline_retry_exhausted_total offset 5m) > 0
        labels:
          severity: critical
        annotations:
          summary: Pipeline 재시도 소진을 확인했다
      - alert: PipelineCommitFailure
        expr: |
          sum(increase(pulsemetry_pipeline_commit_failures_total[5m])) > 0
            or sum(pulsemetry_pipeline_commit_failures_total unless pulsemetry_pipeline_commit_failures_total offset 5m) > 0
        labels:
          severity: warning
        annotations:
          summary: Kafka commit 실패를 확인했다
      - alert: ObservabilityDiskSpaceLow
        expr: kubelet_volume_stats_available_bytes{namespace="pulsemetry-observability"} / kubelet_volume_stats_capacity_bytes{namespace="pulsemetry-observability"} < 0.15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 관측 PVC 잔여 공간이 15퍼센트 미만이다
      - alert: ObservabilityRuleEvaluationFailed
        expr: increase(prometheus_rule_evaluation_failures_total[5m]) > 0
        labels:
          severity: warning
        annotations:
          summary: Prometheus rule 평가 실패를 확인했다
      - alert: KubernetesEventsUnavailable
        expr: absent(up{job="kubernetes-events"}) or (up{job="kubernetes-events"} == 0)
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Kubernetes event 수집기의 지표가 없다
      - alert: LogOutputDroppedRecords
        expr: sum by (job, name) (increase(fluentbit_output_dropped_records_total[5m])) > 0
        labels:
          severity: warning
        annotations:
          summary: 로그 출력에서 폐기한 레코드를 확인했다
      - alert: MskUnderMinimumIsr
        expr: max by (cluster, msk_cluster) (kafka_server_ReplicaManager_Value{job="msk-jmx",name="UnderMinIsrPartitionCount"}) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: MSK partition의 ISR이 최소 개수 미만이다
      # 현재 MSK(KRaft)는 broker JMX로 이 지표를 내지 않아 평소에는 평가 대상이 없다.
      # offline partition은 MSK 대시보드의 CloudWatch OfflinePartitionsCount로 본다. JMX가 지표를 내는 구성을 위해 남긴다.
      - alert: MskOfflinePartitions
        expr: max by (cluster, msk_cluster) (kafka_controller_KafkaController_Value{job="msk-jmx",name="OfflinePartitionsCount"}) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: MSK offline partition이 있다
      - alert: ContainerRestarted
        expr: sum by (cluster, namespace, pod) (increase(kube_pod_container_status_restarts_total{namespace=~"pulsemetry-(dev|perf|observability)"}[5m])) > 0
        labels:
          severity: warning
        annotations:
          summary: Pulsemetry 컨테이너가 재시작했다
      - alert: ContainerOomKilled
        expr: >-
          (kube_pod_container_status_last_terminated_reason{namespace=~"pulsemetry-(dev|perf|observability)",reason="OOMKilled"} == 1) and on (cluster, namespace, pod, container)
          (increase(kube_pod_container_status_restarts_total[5m]) > 0)
        labels:
          severity: critical
        annotations:
          summary: 최근 재시작의 종료 원인이 OOMKilled다
      - alert: FluentBitMetricsUnavailable
        expr: absent(up{job="fluent-bit"}) or (up{job="fluent-bit"} == 0)
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: 노드 로그 수집기 지표가 없다
      - alert: LogOutputRetrying
        expr: sum by (cluster, job, name) (rate(fluentbit_output_retries_total[1m])) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: 로그 전송 재시도가 지속된다
      - alert: PrometheusStorageOperationFailed
        expr: increase(prometheus_tsdb_compactions_failed_total[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: Prometheus TSDB compaction 실패를 확인했다
      - alert: PrometheusConfigurationRejected
        expr: prometheus_config_last_reload_successful == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Prometheus 설정 갱신이 거부됐다
      # Bottlerocket root `/`는 읽기 전용 OS 영역이다. 컨테이너 로그·Fluent Bit buffer가 있는 쓰기 가능한
      # data volume을 감시한다. 같은 device가 bind mount(/local·/var 등)로 반복 노출되므로 device별로 묶는다.
      - alert: NodeDataDiskSpaceLow
        expr: |
          min by (cluster, instance, device) (
            (
              node_filesystem_avail_bytes{job="node-exporter",fstype!~"tmpfs|overlay"}
                / node_filesystem_size_bytes{job="node-exporter",fstype!~"tmpfs|overlay"}
            ) unless on (instance, device, mountpoint) (node_filesystem_readonly{job="node-exporter"} == 1)
          ) < 0.15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 노드 쓰기 가능 data volume 잔여 공간이 15퍼센트 미만이다
      - alert: LogDiskBacklogGrowing
        expr: delta(fluentbit_storage_fs_chunks_down[10m]) > 128
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 로그 disk-only chunk 대기가 10분 동안 128개 이상 증가했다
