[SERVICE]
    Flush 1
    Log_Level info
    HTTP_Server On
    HTTP_Listen 0.0.0.0
    HTTP_Port 2020
    storage.path /tmp/storage
    storage.metrics On
    storage.max_chunks_up 16
[INPUT]
    Name dummy
    Alias smoke
    Dummy {"message":"fixture"}
    Rate 10
    Tag smoke
    storage.type filesystem
[OUTPUT]
    Name null
    Match *
    storage.total_limit_size 1M
