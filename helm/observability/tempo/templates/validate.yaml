{{- /* 고정 주소·단일 replica·PVC 보존을 렌더 때 강제한다(ADR-0039). 리소스를 만들지 않는다. */ -}}
{{- if ne .Release.Namespace "pulsemetry-observability" -}}{{ fail "Tempo release namespace는 pulsemetry-observability여야 한다" }}{{- end -}}
{{- $t := .Values.tempo -}}
{{- if ne $t.fullnameOverride "pulsemetry-tempo" -}}{{ fail "Tempo Service 이름은 pulsemetry-tempo로 고정한다" }}{{- end -}}
{{- if ne (int $t.replicas) 1 -}}{{ fail "Tempo는 단일 replica 영속 볼륨 구성을 사용한다" }}{{- end -}}
{{- if not $t.persistence.enabled -}}{{ fail "Tempo는 PVC에 저장한다" }}{{- end -}}
{{- if $t.persistence.enableStatefulSetAutoDeletePVC -}}{{ fail "upstream의 PVC 자동 삭제(Delete)를 켜지 않는다" }}{{- end -}}
{{- if not (contains "@sha256:" $t.tempo.tag) -}}{{ fail "Tempo 이미지는 digest로 고정한다" }}{{- end -}}
