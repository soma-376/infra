workload: telemetry-ingest
# 생성기가 http|dual|kafka를 덮어쓴다. kafka는 ClusterIP·TGB 없음과 함께만 렌더링된다.
ingestMode: http
env:
  PULSEMETRY_INGEST_PORT: "4316"
  PULSEMETRY_ARCHIVE_TYPE: s3
  PULSEMETRY_ARCHIVE_PREFIX: eks_validation
  PULSEMETRY_CLICKHOUSE_URL: http://clickhouse.pulsemetry-dev.svc.cluster.local:8123
  PULSEMETRY_CLICKHOUSE_DATABASE: default
  # Kafka listener 스레드 수(backend 기본 1). topic partition 6개를 스레드마다 나눠 맡는다.
  # 2026-11-20 부하 시험에서 직렬 처리(약 14건/초)가 상한이었다. CPU·메모리 limit은 그대로다.
  PULSEMETRY_TELEMETRY_KAFKA_CONSUMER_CONCURRENCY: "6"
  # 배치 소비(backend ADR 0083). 레코드를 tenant·분석 테이블마다 INSERT 하나로 묶고, ClickHouse 장기 장애는 S3 넘김 목록
  # (`eks/handoff/…`, 기존 PutObject 범위 안)으로 확정한다. 같은 consumer group이고 앱은 Recreate라 단건·배치가 섞이지 않는다.
  # 끄면(false) 마지막 커밋 위치부터 단건 리스너로 돌아간다. 넘긴 레코드는 되돌아오지 않는다.
  PULSEMETRY_TELEMETRY_KAFKA_CONSUMER_BATCH_ENABLED: "true"
# ADR-0063: 단일 파이프라인 측정 전 Gateway·ingest의 자원 예산을 맞춘다.
resources:
  requests:
    cpu: 500m
    memory: 2Gi
  limits:
    cpu: "2"
    memory: 4Gi
