workload: telemetry-ingest
# ADR 0067: ingest만 replica 2로 노드 두 대의 CPU를 쓴다. hostname 필수 anti-affinity로 ingest Pod끼리도 다른 노드에 놓인다.
# 한 대씩 교체하도록 maxSurge 0·maxUnavailable 1이며(새 노드가 필수는 아니다), PodDisruptionBudget(minAvailable 1)을 함께 렌더한다.
replicaCount: 2
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1
# 생성기가 http|dual|kafka를 덮어쓴다. kafka는 ClusterIP·TGB 없음과 함께만 렌더링된다.
ingestMode: http
env:
  PULSEMETRY_INGEST_PORT: "4316"
  PULSEMETRY_ARCHIVE_TYPE: s3
  PULSEMETRY_ARCHIVE_PREFIX: eks_validation
  PULSEMETRY_CLICKHOUSE_URL: http://clickhouse.pulsemetry-dev.svc.cluster.local:8123
  PULSEMETRY_CLICKHOUSE_DATABASE: default
  # Pod당 Kafka listener 스레드 수(backend 기본 1). Pod 2개 × 3 = 소비자 6으로 topic partition 6과 같다(ADR 0067).
  # 2026-11-20 부하 시험에서 직렬 처리(약 14건/초)가 상한이었다. Pod 하나가 빠지면 남은 Pod의 3개 스레드가 6개 partition을 나눠 맡는다.
  PULSEMETRY_TELEMETRY_KAFKA_CONSUMER_CONCURRENCY: "3"
  # 배치 소비(backend ADR 0083). 레코드를 tenant·분석 테이블마다 INSERT 하나로 묶고, ClickHouse 장기 장애는 S3 넘김 목록
  # (`eks/handoff/…`, 기존 PutObject 범위 안)으로 확정한다. 같은 consumer group이고 RollingUpdate라 배포 중에는 옛·새 Pod가 함께 소비한다.
  # 그래서 처리 방식(단건↔배치)을 바꾸는 커밋은 이 값과 함께 위 strategy 블록 전체를 `{type: Recreate}`로 바꿔 옛 Pod가 모두 끝난 뒤
  # 새 Pod를 띄운다. 다음 커밋에서 RollingUpdate 블록으로 되돌린다. strategy는 Pod template 밖이라 rollout이 없다
  # (두 커밋은 따로 게시한다 — 절차는 helm/dev/workloads/README.md, ADR 0067).
  # 끄면(false) 마지막 커밋 위치부터 단건 리스너로 돌아간다. 넘긴 레코드는 되돌아오지 않는다.
  PULSEMETRY_TELEMETRY_KAFKA_CONSUMER_BATCH_ENABLED: "true"
  # PROJ-347: 배치 하나의 동시 S3 PUT 수(소비 스레드마다, backend 기본 8). 배치당 아카이브 시간을 줄인다.
  # S3 연결 풀은 backend가 max(50, 소비자 수 × (동시 수 + 1))로 맞추므로(Pod당 3 × 17 = 51) 그 backend 이미지가 먼저 반영돼야 한다.
  PULSEMETRY_TELEMETRY_KAFKA_CONSUMER_BATCH_ARCHIVE_CONCURRENCY: "16"
# ADR-0063: 단일 파이프라인 측정 전 Gateway·ingest의 자원 예산을 맞춘다.
resources:
  requests:
    cpu: 500m
    memory: 2Gi
  limits:
    cpu: "2"
    memory: 4Gi
