{{- include "kafkaAdmin.validate" . -}}
{{- range $name := list "telemetry-kafka-admin" "telemetry-kafka-offsets" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "kafkaAdmin.labels" $ | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
