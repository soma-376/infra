apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.workload }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pulsemetry.app.labels" . | nindent 4 }}
spec:
  {{- /* ClusterIP는 kafka 모드 ingest의 내부 health 전용이다. 외부 OTLP 노출·TGB가 없다. (ADR-0036) */}}
  type: {{ .Values.service.type }}
  {{- if eq .Values.service.type "NodePort" }}
  externalTrafficPolicy: {{ if eq (.Values.environment | default "dev") "perf" }}Local{{ else }}Cluster{{ end }}
  {{- end }}
  selector:
    {{- include "pulsemetry.app.selector" . | nindent 4 }}
  ports:
    - name: http
      port: {{ include "pulsemetry.app.port" . }}
      targetPort: http
      {{- if eq .Values.service.type "NodePort" }}
      nodePort: {{ include "pulsemetry.app.nodePort" . }}
      {{- end }}
      protocol: TCP
