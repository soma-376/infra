{{- range .Values.targetGroupBindings }}
---
apiVersion: elbv2.k8s.aws/v1beta1
kind: TargetGroupBinding
metadata:
  name: {{ $.Values.workload }}-{{ .stage }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "pulsemetry.app.labels" $ | nindent 4 }}
spec:
  targetGroupARN: {{ .targetGroupARN | quote }}
  targetType: instance
  vpcID: {{ $.Values.vpcId | quote }}
  serviceRef:
    name: {{ $.Values.workload }}
    port: http
  nodeSelector:
    matchLabels:
      kubernetes.io/arch: arm64
      karpenter.sh/nodepool: {{ if eq ($.Values.environment | default "dev") "perf" }}perf-gateway{{ else }}pulsemetry-dev-apps{{ end }}
{{- end }}
