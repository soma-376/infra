{{- if .Values.metrics.enabled }}
{{- /* backend 관리 포트 9404 계약(backend ADR 0068·0079)을 가진 앱만 연다. */}}
{{- if not (has .Values.workload (list "telemetry-gateway" "telemetry-ingest" "enrollment-api" "dashboard-api")) }}{{ fail "metrics는 Gateway·ingest·enrollment·dashboard만 지원한다" }}{{ end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.workload }}-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pulsemetry.app.labels" . | nindent 4 }}
    observability.pulsemetry.io/endpoint: metrics
spec:
  type: ClusterIP
  selector:
    {{- include "pulsemetry.app.selector" . | nindent 4 }}
  ports:
    - name: metrics
      port: 9404
      targetPort: metrics
      protocol: TCP
{{- end }}
