{{- include "pulsemetry.app.validate" . -}}
{{- $oidc := .Values.oidc | default (dict "enabled" false) -}}
{{- $telemetry := .Values.telemetryJwt | default (dict "enabled" false) -}}
{{- $kafka := .Values.kafka | default (dict "enabled" false) -}}
{{- $mounts := list -}}
{{- $volumes := list -}}
{{- if .Values.runtime.enabled -}}
{{- $mounts = append $mounts (dict "name" "secrets-store" "mountPath" "/mnt/secrets-store" "readOnly" true) -}}
{{- $volumes = append $volumes (dict "name" "secrets-store" "spc" .Values.runtime.secretProviderClass) -}}
{{- if .Values.jwt.enabled -}}
{{- $mounts = append $mounts (dict "name" "user-jwt" "mountPath" "/mnt/user-jwt/keys" "readOnly" true) -}}
{{- $volumes = append $volumes (dict "name" "user-jwt" "spc" .Values.jwt.secretProviderClass) -}}
{{- end -}}
{{- end -}}
{{- /* telemetry JWT는 configtree·사용자 JWT와 독립된 mount다. Gateway는 configtree 없이 이 mount만 쓴다. (ADR-0036) */ -}}
{{- if $telemetry.enabled -}}
{{- $mounts = append $mounts (dict "name" "telemetry-jwt" "mountPath" "/mnt/telemetry-jwt/keys" "readOnly" true) -}}
{{- $volumes = append $volumes (dict "name" "telemetry-jwt" "spc" $telemetry.secretProviderClass) -}}
{{- end -}}
{{- $pulsemetry := dict -}}
{{- if .Values.jwt.enabled -}}
{{- $files := dict -}}
{{- range .Values.jwt.publicKeys -}}
{{- $_ := set $files (printf "[%s]" .kid) (printf "/mnt/user-jwt/keys/%s" .alias) -}}
{{- end -}}
{{- $_ := set $pulsemetry "user-auth" (dict "public-key-files" $files) -}}
{{- if $oidc.enabled -}}
{{- $clients := dict -}}
{{- range $oidc.clients -}}
{{- $_ := set $clients (printf "[%s]" .key) (printf "${%s}" .alias) -}}
{{- end -}}
{{- $_ := set $pulsemetry "oidc" (dict "callback-registration-id" $oidc.callbackRegistrationId "allow-insecure-localhost" ($oidc.allowInsecureLocalhost | default false) "client-secrets" $clients) -}}
{{- end -}}
{{- end -}}
{{- if $telemetry.enabled -}}
{{- $files := dict -}}
{{- range $telemetry.publicKeys -}}
{{- $_ := set $files (printf "[%s]" .kid) (printf "/mnt/telemetry-jwt/keys/%s" .alias) -}}
{{- end -}}
{{- /* issuer·audience·typ·scope는 backend 고정 계약값이라 설정으로 주지 않는다. (ADR-0036) */ -}}
{{- $settings := dict "public-key-files" $files -}}
{{- if eq .Values.workload "enrollment-api" -}}
{{- $_ := set $settings "active-kid" $telemetry.activeKid -}}
{{- $_ := set $settings "private-key-file" "/mnt/telemetry-jwt/keys/private.pem" -}}
{{- $_ := set $settings "issue-enabled" $telemetry.issueEnabled -}}
{{- end -}}
{{- $_ := set $pulsemetry "telemetry-jwt" $settings -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.workload }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pulsemetry.app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "pulsemetry.app.selector" . | nindent 6 }}
  template:
    metadata:
      {{- if or .Values.jwt.enabled $telemetry.enabled }}
      annotations:
        {{- if .Values.jwt.enabled }}
        pulsemetry.io/jwt-revision: {{ .Values.jwt | toJson | sha256sum | quote }}
        {{- if $oidc.enabled }}
        pulsemetry.io/oidc-revision: {{ $oidc | toJson | sha256sum | quote }}
        {{- end }}
        {{- end }}
        {{- if $telemetry.enabled }}
        pulsemetry.io/telemetry-jwt-revision: {{ $telemetry | toJson | sha256sum | quote }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "pulsemetry.app.selector" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.workload }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      nodeSelector:
        kubernetes.io/arch: arm64
        karpenter.sh/nodepool: pulsemetry-dev-apps
      terminationGracePeriodSeconds: {{ include "pulsemetry.app.grace" . }}
      {{- if $mounts }}
      initContainers:
        - name: verify-configtree
          image: {{ printf "%s@%s" .Values.image.repository .Values.image.digest | quote }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              {{- if .Values.runtime.enabled }}
              test -x /mnt/secrets-store
              for file in {{ join " " .Values.runtime.requiredFiles }}; do
                test -f "/mnt/secrets-store/$file"
                test -r "/mnt/secrets-store/$file"
                test -s "/mnt/secrets-store/$file"
                head -c 1 "/mnt/secrets-store/$file" > /dev/null
              done
              {{- if .Values.jwt.enabled }}
              test -x /mnt/user-jwt/keys
              for file in {{ range .Values.jwt.publicKeys }}{{ .alias }} {{ end }}{{ if eq .Values.workload "enrollment-api" }}private.pem{{ end }}; do
                test -f "/mnt/user-jwt/keys/$file"
                test -r "/mnt/user-jwt/keys/$file"
                test -s "/mnt/user-jwt/keys/$file"
                head -c 1 "/mnt/user-jwt/keys/$file" > /dev/null
              done
              {{- end }}
              {{- end }}
              {{- if $telemetry.enabled }}
              test -x /mnt/telemetry-jwt/keys
              for file in {{ range $telemetry.publicKeys }}{{ .alias }} {{ end }}{{ if eq .Values.workload "enrollment-api" }}private.pem{{ end }}; do
                test -f "/mnt/telemetry-jwt/keys/$file"
                test -r "/mnt/telemetry-jwt/keys/$file"
                test -s "/mnt/telemetry-jwt/keys/$file"
                head -c 1 "/mnt/telemetry-jwt/keys/$file" > /dev/null
              done
              {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            {{- toYaml $mounts | nindent 12 }}
      {{- end }}
      containers:
        - name: {{ .Values.workload }}
          image: {{ printf "%s@%s" .Values.image.repository .Values.image.digest | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: {{ include "pulsemetry.app.port" . }}
              protocol: TCP
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: 9404
              protocol: TCP
            {{- end }}
          {{- if or .Values.env .Values.runtime.enabled $pulsemetry $kafka.enabled .Values.ingestMode .Values.metrics.enabled }}
          env:
            {{- if .Values.metrics.enabled }}
            - name: MANAGEMENT_SERVER_PORT
              value: "9404"
            {{- end }}
            {{- if .Values.runtime.enabled }}
            - name: SPRING_CONFIG_IMPORT
              value: "configtree:/mnt/secrets-store/"
            {{- end }}
            {{- if .Values.jwt.enabled }}
            - name: PULSEMETRY_USER_AUTH_ENABLED
              value: "true"
            - name: PULSEMETRY_USER_AUTH_ISSUER
              value: {{ .Values.userAuth.issuer | quote }}
            - name: PULSEMETRY_USER_AUTH_AUDIENCE
              value: {{ .Values.userAuth.audience | quote }}
            - name: PULSEMETRY_USER_AUTH_ALLOWED_ORIGINS
              value: {{ join "," .Values.userAuth.allowedOrigins | quote }}
            {{- if and (eq .Values.workload "enrollment-api") .Values.userAuth.allowedRedirectUris }}
            - name: PULSEMETRY_USER_AUTH_ALLOWED_REDIRECT_URIS
              value: {{ join "," .Values.userAuth.allowedRedirectUris | quote }}
            {{- end }}
            {{- end }}
            {{- /* 사용자 JWT·OIDC·telemetry JWT 맵을 한 SPRING_APPLICATION_JSON에 합친다. 중복 선언으로 기존 맵을 지우지 않는다. */}}
            {{- if $pulsemetry }}
            - name: SPRING_APPLICATION_JSON
              value: {{ dict "pulsemetry" $pulsemetry | toJson | quote }}
            {{- end }}
            {{- if and .Values.jwt.enabled (eq .Values.workload "enrollment-api") }}
            - name: PULSEMETRY_USER_AUTH_ACTIVE_KID
              value: {{ .Values.jwt.activeKid | quote }}
            - name: PULSEMETRY_USER_AUTH_PRIVATE_KEY_FILE
              value: /mnt/user-jwt/keys/private.pem
            {{- end }}
            {{- if hasKey .Values "oidc" }}
            - name: PULSEMETRY_OIDC_ENABLED
              value: {{ $oidc.enabled | toString | quote }}
            {{- if $oidc.enabled }}
            - name: PULSEMETRY_OIDC_CALLBACK_BASE_URL
              value: {{ $oidc.callbackBaseUrl | quote }}
            {{- if $oidc.failureRedirectUri }}
            - name: PULSEMETRY_OIDC_FAILURE_REDIRECT_URI
              value: {{ $oidc.failureRedirectUri | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if .Values.ingestMode }}
            - name: PULSEMETRY_INGEST_MODE
              value: {{ .Values.ingestMode | quote }}
            {{- end }}
            {{- if $kafka.enabled }}
            - name: PULSEMETRY_KAFKA_BOOTSTRAP_SERVERS
              value: {{ $kafka.bootstrapServers | quote }}
            - name: PULSEMETRY_KAFKA_SECURITY
              value: "iam"
            - name: PULSEMETRY_KAFKA_TOPIC
              value: {{ $kafka.topic | quote }}
            {{- if $kafka.consumerGroup }}
            - name: PULSEMETRY_KAFKA_CONSUMER_GROUP
              value: {{ $kafka.consumerGroup | quote }}
            {{- end }}
            - name: PULSEMETRY_KAFKA_IAM_ROLE_ARN
              value: {{ $kafka.iamRoleArn | quote }}
            - name: PULSEMETRY_KAFKA_IAM_SESSION_NAME
              value: {{ $kafka.iamSessionName | quote }}
            {{- end }}
            {{- range $name, $value := .Values.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- /* liveness는 Kafka·RDS·S3 일시 장애로 재시작을 반복하지 않는다. dual·kafka ingest만 멈춘 Kafka listener를
               503으로 알리는 health를 보고 재기동한다. 그 health는 저장소·MSK를 확인하지 않는다. (ADR-0036) */}}
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            {{- if eq .Values.workload "telemetry-ingest" }}
            failureThreshold: 48
            {{- else }}
            failureThreshold: 12
            {{- end }}
          readinessProbe:
            httpGet:
              path: /api/v1/healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 6
            failureThreshold: 3
          livenessProbe:
            {{- if and (eq .Values.workload "telemetry-ingest") (has .Values.ingestMode (list "dual" "kafka")) }}
            httpGet:
              path: /api/v1/healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 6
            failureThreshold: 3
            {{- else }}
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
            {{- end }}
          {{- if $mounts }}
          volumeMounts:
            {{- toYaml $mounts | nindent 12 }}
          {{- end }}
      {{- if $volumes }}
      volumes:
        {{- range $volumes }}
        - name: {{ .name }}
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ .spc | quote }}
        {{- end }}
      {{- end }}
