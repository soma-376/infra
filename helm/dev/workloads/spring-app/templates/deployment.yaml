{{- include "pulsemetry.app.validate" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.workload }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pulsemetry.app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "pulsemetry.app.selector" . | nindent 6 }}
  template:
    metadata:
      {{- if .Values.jwt.enabled }}
      annotations:
        pulsemetry.io/jwt-revision: {{ .Values.jwt | toJson | sha256sum | quote }}
      {{- end }}
      labels:
        {{- include "pulsemetry.app.selector" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.workload }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      nodeSelector:
        kubernetes.io/arch: arm64
        karpenter.sh/nodepool: pulsemetry-dev-apps
      terminationGracePeriodSeconds: 60
      {{- if .Values.runtime.enabled }}
      initContainers:
        - name: verify-configtree
          image: {{ printf "%s@%s" .Values.image.repository .Values.image.digest | quote }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              test -x /mnt/secrets-store
              for file in {{ join " " .Values.runtime.requiredFiles }}; do
                test -f "/mnt/secrets-store/$file"
                test -r "/mnt/secrets-store/$file"
                test -s "/mnt/secrets-store/$file"
                head -c 1 "/mnt/secrets-store/$file" > /dev/null
              done
              {{- if .Values.jwt.enabled }}
              test -x /mnt/user-jwt/keys
              for file in {{ range .Values.jwt.publicKeys }}{{ .alias }} {{ end }}{{ if eq .Values.workload "enrollment-api" }}private.pem{{ end }}; do
                test -f "/mnt/user-jwt/keys/$file"
                test -r "/mnt/user-jwt/keys/$file"
                test -s "/mnt/user-jwt/keys/$file"
                head -c 1 "/mnt/user-jwt/keys/$file" > /dev/null
              done
              {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
            {{- if .Values.jwt.enabled }}
            - name: user-jwt
              mountPath: /mnt/user-jwt/keys
              readOnly: true
            {{- end }}
      {{- end }}
      containers:
        - name: {{ .Values.workload }}
          image: {{ printf "%s@%s" .Values.image.repository .Values.image.digest | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: {{ include "pulsemetry.app.port" . }}
              protocol: TCP
          {{- if or .Values.env .Values.runtime.enabled }}
          env:
            {{- if .Values.runtime.enabled }}
            - name: SPRING_CONFIG_IMPORT
              value: "configtree:/mnt/secrets-store/"
            {{- end }}
            {{- if .Values.jwt.enabled }}
            - name: PULSEMETRY_USER_AUTH_ENABLED
              value: "true"
            - name: PULSEMETRY_USER_AUTH_ISSUER
              value: {{ .Values.userAuth.issuer | quote }}
            - name: PULSEMETRY_USER_AUTH_AUDIENCE
              value: {{ .Values.userAuth.audience | quote }}
            - name: PULSEMETRY_USER_AUTH_ALLOWED_ORIGINS
              value: {{ join "," .Values.userAuth.allowedOrigins | quote }}
            {{- $files := dict }}
            {{- range .Values.jwt.publicKeys }}
            {{- $_ := set $files (printf "[%s]" .kid) (printf "/mnt/user-jwt/keys/%s" .alias) }}
            {{- end }}
            - name: SPRING_APPLICATION_JSON
              value: {{ dict "pulsemetry" (dict "user-auth" (dict "public-key-files" $files)) | toJson | quote }}
            {{- if eq .Values.workload "enrollment-api" }}
            - name: PULSEMETRY_USER_AUTH_ACTIVE_KID
              value: {{ .Values.jwt.activeKid | quote }}
            - name: PULSEMETRY_USER_AUTH_PRIVATE_KEY_FILE
              value: /mnt/user-jwt/keys/private.pem
            {{- end }}
            {{- end }}
            {{- range $name, $value := .Values.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            {{- if eq .Values.workload "telemetry-ingest" }}
            failureThreshold: 48
            {{- else }}
            failureThreshold: 12
            {{- end }}
          readinessProbe:
            httpGet:
              path: /api/v1/healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 6
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          {{- if .Values.runtime.enabled }}
          volumeMounts:
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
            {{- if .Values.jwt.enabled }}
            - name: user-jwt
              mountPath: /mnt/user-jwt/keys
              readOnly: true
            {{- end }}
          {{- end }}
      {{- if .Values.runtime.enabled }}
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ .Values.runtime.secretProviderClass | quote }}
        {{- if .Values.jwt.enabled }}
        - name: user-jwt
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ .Values.jwt.secretProviderClass | quote }}
        {{- end }}
      {{- end }}
