# workload별 values와 immutable 이미지 digest를 함께 전달한다.
workload: ""
replicaCount: 1
image:
  repository: ""
  digest: ""
resources:
  requests:
    cpu: 250m
    memory: 1Gi
  limits:
    cpu: "1"
    memory: 2Gi
env: {}
# ClusterIP는 Kafka 전용 ingest의 내부 health Service에만 쓴다. TGB를 함께 선언할 수 없다.
service:
  type: NodePort
# SecretProviderClass는 별도 runtime-config release가 소유한다.
runtime:
  enabled: false
  secretProviderClass: ""
  requiredFiles: []
# validation/canary 전용 TG만 전달한다. 기존 ECS TG는 사용하지 않는다.
targetGroupBindings: []
vpcId: ""
# JWT는 configtree와 다른 CSI volume에 고정 버전의 PEM으로 공급한다.
jwt:
  enabled: false
# telemetry JWT는 사용자 JWT와 별도 SPC·mount를 쓴다. (ADR-0036)
telemetryJwt:
  enabled: false
# Kafka 접속값은 CDK output과 bootstrap 조회 JSON에서 생성기가 채운다. (ADR-0036)
kafka:
  enabled: false

# GC·safepoint INFO를 stderr에 남긴다. 옵션 문자열은 backend 인계값으로 chart가 고정한다.
# 성능 비교는 calibration부터 같은 값을 쓴다. 생성기는 runtime-values의 jvmGcSafepointLog로 켠다. (ADR-0037)
jvm:
  gcSafepointLog: false

# Gateway·ingest의 플랫폼 trace(ADR-0039·backend ADR 0069). 생성기가 runtime-values의 platformTracing으로 켠다.
# 끄면 env를 렌더하지 않아 앱은 Tracer NOOP으로 지금과 같이 동작한다.
tracing:
  enabled: false
  endpoint: ""
  sampleProbability: "0.1"
  cluster: ""

# 기존 앱 이미지와의 호환을 위해 관측 이미지 배포 때만 활성화한다.
metrics:
  enabled: false
