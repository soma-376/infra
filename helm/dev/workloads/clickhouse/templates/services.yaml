apiVersion: v1
kind: Service
metadata:
  name: clickhouse-headless
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pulsemetry.clickhouse.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    {{- include "pulsemetry.clickhouse.selector" . | nindent 4 }}
  ports:
    - name: http
      port: 8123
      targetPort: http
      protocol: TCP
    - name: native
      port: 9000
      targetPort: native
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pulsemetry.clickhouse.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "pulsemetry.clickhouse.selector" . | nindent 4 }}
  ports:
    - name: http
      port: 8123
      targetPort: http
      protocol: TCP
    - name: native
      port: 9000
      targetPort: native
      protocol: TCP
