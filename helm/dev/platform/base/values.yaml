# CDK outputs에서 생성한다. 고정 계정·리소스 ID를 저장하지 않는다.
nodeRoleName: ""
subnetIds: []
appNodeSecurityGroupId: ""
clickhouseNodeSecurityGroupId: ""
clickhouseAvailabilityZone: ""
# 최초 배치 예산이다. 실측 후 NodePool limits와 Pod requests를 함께 검토한다.
apps:
  cpuLimit: "8"
clickhouse:
  cpuLimit: "4"

observabilityNodeSecurityGroupId: ""

# 관측 namespace의 Loki·Tempo·플랫폼 Collector 수신 정책을 강제하는 controller(ADR-0039).
# 끄기 전에 그 정책부터 지운다(런북 PROJ-256 절의 복구 순서).
networkPolicyController:
  enabled: true
