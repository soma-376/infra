# CDK outputs에서 생성한다. 고정 계정·리소스 ID를 저장하지 않는다.
nodeRoleName: ""
subnetIds: []
appNodeSecurityGroupId: ""
clickhouseNodeSecurityGroupId: ""
clickhouseAvailabilityZone: ""
# ADR 0067: 부하 시험 때 apps 정상 4대(Gateway·ingest 2·k6, hostname 필수 분리)와 노드 교체 여유 2대를 위한 예산이다.
# t4g.large 6대 = 12 vCPU. 실제 대수는 배치에 따른다.
apps:
  instanceType: t4g.large
  cpuLimit: "12"
# ADR 0066: ClickHouse 1대(4 vCPU)와 노드 교체 중 옛 노드를 함께 수용하는 예산이다.
clickhouse:
  instanceType: m7g.xlarge
  cpuLimit: "8"

observabilityNodeSecurityGroupId: ""

# 관측 namespace의 Loki·Tempo·플랫폼 Collector 수신 정책을 강제하는 controller(ADR-0039).
# 끄기 전에 그 정책부터 지운다(런북 PROJ-256 절의 복구 순서).
networkPolicyController:
  enabled: true

# ADR-0049: 기존 풀과 독립된 단일 AZ Kafka 전용 노드·스토리지다.
kafka:
  enabled: false
  securityGroupId: ""
  availabilityZone: ""
