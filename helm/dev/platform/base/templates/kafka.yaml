{{- if .Values.kafka.enabled }}
{{- $az := required "Kafka AZ는 CDK output에서 공급한다" .Values.kafka.availabilityZone -}}
{{- if ne $az .Values.clickhouseAvailabilityZone }}{{ fail "Kafka는 ClickHouse와 같은 AZ에 둔다" }}{{ end }}
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: pulsemetry-kafka-gp3
  annotations:
    helm.sh/resource-policy: keep
provisioner: ebs.csi.eks.amazonaws.com
parameters:
  type: gp3
  encrypted: "true"
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
allowVolumeExpansion: true
allowedTopologies:
  - matchLabelExpressions:
      - key: eks.amazonaws.com/compute-type
        values: [auto]
      - key: topology.kubernetes.io/zone
        values: [{{ $az | quote }}]
---
apiVersion: eks.amazonaws.com/v1
kind: NodeClass
metadata:
  name: pulsemetry-dev-kafka
spec:
  role: {{ .Values.nodeRoleName | quote }}
  subnetSelectorTerms:
    {{- range .Values.subnetIds }}
    - id: {{ . | quote }}
    {{- end }}
  securityGroupSelectorTerms:
    - id: {{ required "Kafka SG는 CDK output에서 공급한다" .Values.kafka.securityGroupId | quote }}
  advancedNetworking:
    associatePublicIPAddress: true
  ephemeralStorage:
    size: "80Gi"
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: pulsemetry-dev-kafka
spec:
  template:
    metadata:
      labels:
        pulsemetry.io/workload: kafka
    spec:
      nodeClassRef:
        group: eks.amazonaws.com
        kind: NodeClass
        name: pulsemetry-dev-kafka
      taints:
        - key: workload
          value: kafka
          effect: NoSchedule
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: [arm64]
        - key: karpenter.sh/capacity-type
          operator: In
          values: [on-demand]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: [m7g.large]
        - key: topology.kubernetes.io/zone
          operator: In
          values: [{{ $az | quote }}]
  limits:
    cpu: "8"
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 5m
    budgets:
      - nodes: "1"
{{- end }}
