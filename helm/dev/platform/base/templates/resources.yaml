{{- $role := required "nodeRoleName은 필수다" .Values.nodeRoleName -}}
{{- $appSg := required "appNodeSecurityGroupId는 필수다" .Values.appNodeSecurityGroupId -}}
{{- $chSg := required "clickhouseNodeSecurityGroupId는 필수다" .Values.clickhouseNodeSecurityGroupId -}}
{{- $az := required "clickhouseAvailabilityZone은 필수다" .Values.clickhouseAvailabilityZone -}}
{{- if not .Values.subnetIds }}{{ fail "subnetIds는 최소 두 public subnet ID를 요구한다" }}{{ end -}}
{{- if lt (len .Values.subnetIds) 2 }}{{ fail "subnetIds는 최소 두 public subnet ID를 요구한다" }}{{ end -}}
apiVersion: v1
kind: Namespace
metadata:
  name: pulsemetry-dev
  annotations:
    helm.sh/resource-policy: keep
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: pulsemetry-dev-gp3
  annotations:
    helm.sh/resource-policy: keep
provisioner: ebs.csi.eks.amazonaws.com
parameters:
  type: gp3
  encrypted: "true"
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
allowVolumeExpansion: true
allowedTopologies:
  - matchLabelExpressions:
      - key: eks.amazonaws.com/compute-type
        values: [auto]
      - key: topology.kubernetes.io/zone
        values: [{{ $az | quote }}]
{{ range $pool := list "apps" "clickhouse" }}
---
apiVersion: eks.amazonaws.com/v1
kind: NodeClass
metadata:
  name: pulsemetry-dev-{{ $pool }}
spec:
  role: {{ $role | quote }}
  subnetSelectorTerms:
    {{- range $.Values.subnetIds }}
    - id: {{ . | quote }}
    {{- end }}
  securityGroupSelectorTerms:
    - id: {{ ternary $appSg $chSg (eq $pool "apps") | quote }}
  advancedNetworking:
    associatePublicIPAddress: true
  ephemeralStorage:
    size: "80Gi"
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: pulsemetry-dev-{{ $pool }}
spec:
  template:
    metadata:
      labels:
        pulsemetry.io/workload: {{ $pool }}
    spec:
      nodeClassRef:
        group: eks.amazonaws.com
        kind: NodeClass
        name: pulsemetry-dev-{{ $pool }}
      {{- if eq $pool "clickhouse" }}
      taints:
        - key: workload
          value: clickhouse
          effect: NoSchedule
      {{- end }}
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: [arm64]
        - key: karpenter.sh/capacity-type
          operator: In
          values: [on-demand]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: [t4g.medium]
        {{- if eq $pool "clickhouse" }}
        - key: topology.kubernetes.io/zone
          operator: In
          values: [{{ $az | quote }}]
        {{- end }}
  limits:
    cpu: {{ (index $.Values $pool).cpuLimit | quote }}
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 5m
{{ end }}
