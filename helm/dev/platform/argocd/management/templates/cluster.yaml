# 인증 원문이 없는 연결 선언이다. Argo가 기존 ServiceAccount의 projected token/CA를 사용한다.
# namespace 제한으로 cache의 list/watch도 관리 대상에 한정한다.
{{- if .Values.reconciliationEnabled }}
apiVersion: v1
kind: Secret
metadata:
  name: argocd-dev-in-cluster
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: cluster
type: Opaque
stringData:
  name: pulsemetry-dev
  server: https://kubernetes.default.svc
  namespaces: argocd,kube-system,pulsemetry-dev,pulsemetry-dev-logs,pulsemetry-observability,strimzi-system
  clusterResources: "true"
  config: '{}'
{{- end }}
