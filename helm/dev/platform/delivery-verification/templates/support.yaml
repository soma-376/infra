{{- if .Values.enabled -}}
{{- if ne (len .Values.applicationNames) 18 -}}{{- fail "검증 bootstrap에는 실제 Application 18개가 필요하다" -}}{{- end -}}
{{- $applications := .Files.Get "applications.json" | fromJsonArray -}}
{{- if or (ne (len (uniq .Values.applicationNames)) 18) (ne (toJson (sortAlpha .Values.applicationNames)) (toJson (sortAlpha $applications))) -}}{{- fail "검증 Application은 catalog 18개와 정확히 같아야 한다" -}}{{- end -}}
{{- if ne (len .Values.jobNames) 4 -}}{{- fail "검증 bootstrap에는 실제 Job 4개가 필요하다" -}}{{- end -}}
{{- if ne (len (uniq .Values.jobNames)) 4 -}}{{- fail "검증 Job 이름을 중복할 수 없다" -}}{{- end -}}
{{- range .Values.jobNames -}}
{{- if or (gt (len .) 60) (not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?-verify$" .)) -}}{{- fail "검증 Job은 실제 release-verify 이름이어야 한다" -}}{{- end -}}
{{- end -}}
{{- if ne (toJson (sortAlpha .Values.workloadNames)) (toJson (sortAlpha (list "enrollment-api" "telemetry-ingest" "telemetry-gateway" "dashboard-api"))) -}}{{- fail "검증 Deployment는 고정 네 workload여야 한다" -}}{{- end -}}
{{- if ne .Values.prometheus.namespace "pulsemetry-observability" -}}{{- fail "Prometheus namespace는 pulsemetry-observability여야 한다" -}}{{- end -}}
{{- if not (regexMatch "^arn:aws:secretsmanager:ap-northeast-2:[0-9]{12}:secret:pulsemetry/dev/deployment-verifier-[A-Za-z0-9]{6}$" .Values.probeSecretArn) -}}{{- fail "전용 probe Secret ARN이 필요하다" -}}{{- end -}}
{{- if not (regexMatch "^[A-Za-z0-9-]{32,64}$" .Values.probeSecretVersionId) -}}{{- fail "probe 고정 VersionId가 필요하다" -}}{{- end -}}
{{- if not (regexMatch "^[a-z0-9-]+:9090$" .Values.prometheus.proxyName) -}}{{- fail "정확한 Prometheus service:9090이 필요하다" -}}{{- end -}}
apiVersion: v1
kind: ServiceAccount
metadata: {name: deployment-verifier, namespace: pulsemetry-dev}
automountServiceAccountToken: false
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata: {name: deployment-verifier, namespace: pulsemetry-dev}
spec:
  provider: aws
  parameters:
    usePodIdentity: "true"
    region: ap-northeast-2
    objects: |
      - objectName: {{ .Values.probeSecretArn | quote }}
        objectType: secretsmanager
        objectVersion: {{ .Values.probeSecretVersionId | quote }}
        objectAlias: probe.json
        filePermission: "0440"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: gitops-delivery-observer, namespace: argocd}
rules:
  - apiGroups: [argoproj.io]
    resources: [applications]
    resourceNames: {{ append .Values.applicationNames "pulsemetry-dev-root" | uniq | toJson }}
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: gitops-delivery-observer, namespace: argocd}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: gitops-delivery-observer}
subjects:
  - {kind: Group, name: "pulsemetry:dev:gitops-observer", apiGroup: rbac.authorization.k8s.io}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: gitops-delivery-observer, namespace: pulsemetry-dev}
rules:
  - apiGroups: [batch]
    resources: [jobs]
    resourceNames: {{ .Values.jobNames | toJson }}
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: {{ .Values.workloadNames | toJson }}
    verbs: [get]
  - apiGroups: [secrets-store.csi.x-k8s.io]
    resources: [secretproviderclasses]
    resourceNames: [enrollment-api-runtime, telemetry-ingest-runtime, dashboard-api-runtime, enrollment-api-jwt, dashboard-api-jwt, enrollment-api-telemetry-jwt, telemetry-ingest-telemetry-jwt, telemetry-gateway-telemetry-jwt]
    verbs: [get]
  - apiGroups: [secrets-store.csi.x-k8s.io]
    resources: [secretproviderclasspodstatuses]
    verbs: [list]
  # 응답 필드 제한은 RBAC가 제공하지 않는다. 고정 verifier는 PartialObjectMetadata만 수락한다.
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [soma-376-dev-telemetry-cluster-ca-cert, pulsemetry-gateway-main, pulsemetry-ingest-main, pulsemetry-topic-admin-main, pulsemetry-offset-admin-main]
    verbs: [get]
  # Pod 이름은 매 실행 달라진다. RBAC list에는 label 강제가 없어 이 namespace만 허용한다.
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: gitops-delivery-observer, namespace: pulsemetry-dev}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: gitops-delivery-observer}
subjects:
  - {kind: Group, name: "pulsemetry:dev:gitops-observer", apiGroup: rbac.authorization.k8s.io}
  - {kind: ServiceAccount, name: deployment-verifier, namespace: pulsemetry-dev}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: gitops-delivery-metrics, namespace: {{ .Values.prometheus.namespace }}}
rules:
  - apiGroups: [""]
    resources: [services/proxy]
    resourceNames: [{{ .Values.prometheus.proxyName | quote }}]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: gitops-delivery-metrics, namespace: {{ .Values.prometheus.namespace }}}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: gitops-delivery-metrics}
subjects:
  - {kind: Group, name: "pulsemetry:dev:gitops-observer", apiGroup: rbac.authorization.k8s.io}
  - {kind: ServiceAccount, name: deployment-verifier, namespace: pulsemetry-dev}
{{- end -}}
