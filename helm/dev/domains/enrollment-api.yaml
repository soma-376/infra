# 기존 release values 위에 적용하는 도메인 전환 입력이다. issuer/Secret/이미지는 보존한다.
userAuth:
  allowedOrigins:
    - https://dev.pulsemetry.co.kr
    - https://pulsemetry-dev.kro.kr
    - http://localhost:3000
  allowedRedirectUris:
    - https://dev.pulsemetry.co.kr/auth/callback
    - https://pulsemetry-dev.kro.kr/auth/callback
oidc:
  callbackBaseUrl: https://api-dev.pulsemetry.co.kr
  failureRedirectUri: https://dev.pulsemetry.co.kr/auth/callback
env:
  PULSEMETRY_PUBLIC_BASE_URL: https://api-dev.pulsemetry.co.kr
