apiVersion: v1
kind: ConfigMap
metadata:
  name: pulsemetry-kafka-metrics
  namespace: {{ .Release.Namespace }}
data:
  kafka-metrics-config.yml: |
    lowercaseOutputName: true
    rules:
      - pattern: 'kafka.server<type=ReplicaManager, name=(UnderReplicatedPartitions|UnderMinIsrPartitionCount)><>Value'
        name: kafka_server_replicamanager_$1
        type: GAUGE
      - pattern: 'kafka.controller<type=KafkaController, name=(OfflinePartitionsCount|ActiveControllerCount)><>Value'
        name: kafka_controller_kafkacontroller_$1
        type: GAUGE
      - pattern: 'kafka.server<type=BrokerTopicMetrics, name=(MessagesInPerSec|BytesInPerSec|BytesOutPerSec), topic=(.+)><>Count'
        name: kafka_server_brokertopicmetrics_$1_total
        type: COUNTER
        labels:
          topic: "$2"
      - pattern: 'kafka.network<type=RequestMetrics, name=TotalTimeMs, request=(Produce|FetchConsumer|FetchFollower)><>Mean'
        name: kafka_network_requestmetrics_totaltimems_mean
        type: GAUGE
        labels:
          request: "$1"
      - pattern: 'kafka.server<type=KafkaServer, name=BrokerState><>Value'
        name: kafka_server_kafkaserver_brokerstate
        type: GAUGE
      - pattern: 'kafka.server<type=socket-server-metrics, listener=(.+), networkProcessor=(.+)><>failed-authentication-total'
        name: kafka_server_socket_server_metrics_failed_authentication_total
        type: COUNTER
        labels:
          listener: "$1"
          networkProcessor: "$2"
