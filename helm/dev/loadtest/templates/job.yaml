{{- include "loadtest.validate" . -}}
{{- $v := .Values -}}
{{- /* backend tools/loadtest/README.md 의 ConfigMap 키 → /scripts 아래 경로. 키가 없으면 Pod 가 뜨지 않는다(조용히 빠지지 않는다). */ -}}
{{- $scripts := list
  (dict "key" "main.js" "path" "main.js")
  (dict "key" "lib.config.js" "path" "lib/config.js")
  (dict "key" "lib.schedule.js" "path" "lib/schedule.js")
  (dict "key" "lib.payload.js" "path" "lib/payload.js")
  (dict "key" "lib.auth.js" "path" "lib/auth.js")
  (dict "key" "lib.summary.js" "path" "lib/summary.js")
  (dict "key" "data.templates.json" "path" "data/templates.json") -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "loadtest.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "loadtest.labels" . | nindent 4 }}
  annotations:
    pulsemetry.io/planned-seconds: {{ include "loadtest.plannedSeconds" . | quote }}
    pulsemetry.io/code-configmap: {{ $v.configMapName | quote }}
spec:
  # 실패한 실행은 재시도하지 않는다. 재실행은 새 testid 다(토큰 교환·backlog 가 섞이지 않게).
  backoffLimit: 0
  activeDeadlineSeconds: {{ include "loadtest.activeDeadlineSeconds" . }}
  # 끝난 Pod 의 로그(summary 블록)를 kubectl logs 로 회수할 시간이다.
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        {{- include "loadtest.labels" . | nindent 8 }}
      annotations:
        # 실행 중 노드 통합·교체로 끊기지 않게 한다.
        karpenter.sh/do-not-disrupt: "true"
        checksum/collector-config: {{ include (print $.Template.BasePath "/collector-config.yaml") . | sha256sum }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        # 시드 Secret 을 0440 으로 마운트하고 k6 가 그룹으로 읽는다.
        fsGroup: 12345
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        kubernetes.io/arch: arm64
        karpenter.sh/nodepool: pulsemetry-dev-apps
      affinity:
        # 측정 대상과 같은 노드의 CPU·네트워크를 나눠 쓰지 않는다(ADR-0064, ADR-0063 의 Gateway·ingest 분리와 같은 키).
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values: [telemetry-gateway, telemetry-ingest]
              namespaces: [pulsemetry-dev]
              topologyKey: kubernetes.io/hostname
      initContainers:
        # native sidecar — k6 보다 먼저 뜨고, k6 가 끝나면 함께 끝난다.
        - name: collector
          image: {{ $v.images.collector | quote }}
          imagePullPolicy: IfNotPresent
          restartPolicy: Always
          args: ["--config=/etc/otelcol/config.yaml"]
          ports:
            - name: metrics
              containerPort: 9404
              protocol: TCP
          # 수신기가 열린 뒤에 k6 를 시작한다 — 첫 지표를 잃지 않게.
          startupProbe:
            tcpSocket:
              port: 4318
            periodSeconds: 1
            failureThreshold: 60
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml $v.resources.collector | nindent 12 }}
          volumeMounts:
            - name: collector-config
              mountPath: /etc/otelcol
              readOnly: true
      containers:
        - name: k6
          image: {{ $v.images.k6 | quote }}
          imagePullPolicy: IfNotPresent
          # REST API 는 Pod 안에서만 연다 — 사람이 `kubectl exec … -c k6 -- k6 pause --address 127.0.0.1:6565` 로 멈춘다.
          args: ["run", "--address", "127.0.0.1:6565", "-o", "opentelemetry", "/scripts/main.js"]
          env:
            - {name: HOME, value: /tmp}
            - {name: K6_NO_USAGE_REPORT, value: "true"}
            - {name: K6_OTEL_EXPORTER_TYPE, value: http}
            - {name: K6_OTEL_HTTP_EXPORTER_ENDPOINT, value: "127.0.0.1:4318"}
            - {name: K6_OTEL_HTTP_EXPORTER_INSECURE, value: "true"}
            - {name: K6_OTEL_METRIC_PREFIX, value: k6_}
            - {name: K6_OTEL_FLUSH_INTERVAL, value: 1s}
            - {name: K6_OTEL_EXPORT_INTERVAL, value: 5s}
            - {name: TESTID, value: {{ $v.testid | quote }}}
            - {name: SCENARIO, value: {{ $v.scenario | quote }}}
            - {name: GATEWAY_URL, value: {{ $v.gatewayUrl | quote }}}
            - {name: ENROLLMENT_URL, value: {{ $v.enrollmentUrl | quote }}}
            - {name: IDENTITIES_FILE, value: /seed/identities.json}
            - {name: SEED_SECRET_FILE, value: /seed/seed-secret}
            - {name: START_RPS, value: {{ $v.startRps | quote }}}
            - {name: STEP_RPS, value: {{ $v.stepRps | quote }}}
            - {name: MAX_RPS, value: {{ $v.maxRps | quote }}}
            - {name: RAMP, value: {{ $v.ramp | quote }}}
            - {name: STEP_HOLD, value: {{ $v.stepHold | quote }}}
            - {name: COOLDOWN, value: {{ $v.cooldown | quote }}}
            {{- if $v.holdRps }}
            - {name: HOLD_RPS, value: {{ $v.holdRps | quote }}}
            {{- end }}
            - {name: HOLD_DURATION, value: {{ $v.holdDuration | quote }}}
            - {name: MIX_SIGNAL, value: {{ $v.mixSignal | quote }}}
            - {name: MIX_PRODUCT, value: {{ $v.mixProduct | quote }}}
            - {name: GZIP, value: {{ ternary "1" "0" $v.gzip | quote }}}
          securityContext:
            runAsNonRoot: true
            runAsUser: 12345
            runAsGroup: 12345
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml $v.resources.k6 | nindent 12 }}
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: seed
              mountPath: /seed
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: collector-config
          configMap:
            name: {{ include "loadtest.name" . }}-collector
        - name: scripts
          configMap:
            name: {{ $v.configMapName | quote }}
            items:
              {{- range $scripts }}
              - key: {{ .key }}
                path: {{ .path }}
              {{- end }}
        - name: seed
          secret:
            secretName: {{ $v.seedSecretName | quote }}
            defaultMode: 288  # 0440 — YAML 판본에 따라 8진 해석이 달라 10진으로 쓴다
            items:
              - key: seed-secret
                path: seed-secret
              - key: identities.json
                path: identities.json
        - name: tmp
          emptyDir:
            sizeLimit: {{ $v.tmpSizeLimit }}
