{{- include "loadtest.validate" . -}}
# k6 OTel 출력 → Prometheus 형식 :9404. backend tools/loadtest/local/otel-collector.yaml 과 같은 내용이다(로컬 E2E 가 검증).
# 수신은 같은 Pod 의 k6 뿐이라 루프백에만 연다. 9404 는 관측 차트의 PodMonitor 가 pull 한다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "loadtest.name" . }}-collector
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "loadtest.labels" . | nindent 4 }}
data:
  config.yaml: |
    extensions:
      # startupProbe 대상. 모든 pipeline 이 시작된 뒤에만 200 을 준다. Pod IP 로 열지만 Service 가 없다.
      health_check:
        endpoint: 0.0.0.0:13133
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 127.0.0.1:4318
    processors:
      batch:
        timeout: 1s
    exporters:
      prometheus:
        endpoint: 0.0.0.0:9404
        # 시계열이 사라지지 않게 길게 둔다. Pod 는 k6 종료와 함께 끝나므로, 마지막 scrape 는 k6 의 FINAL_FLUSH 대기가 보장한다.
        metric_expiration: 10m
    service:
      extensions: [health_check]
      pipelines:
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [prometheus]
      telemetry:
        logs:
          level: warn
