# dev 부하 시험 Job(ADR-0064). 시나리오 값은 backend tools/loadtest/README.md 의 k6 설정 표와 1:1 이다.
# 실행마다 testid·configMapName 을 주고, 캠페인마다 seedSecretName 을 맞춘다. 절차는 docs/runbooks/dev-pipeline-loadtest.md.

# 필수. ^[a-z0-9-]{3,40}$. Job 이름(loadtest-<testid>)과 모든 k6 지표의 testid 라벨이다.
testid: ""

# smoke(1 RPS × 60s) | stair | hold
scenario: smoke
startRps: 5
stepRps: 5
maxRps: 60          # 1000 이하
ramp: 30s           # 1초 이상
stepHold: 5m
cooldown: 30s
holdRps: null       # hold 에 필수
holdDuration: 20m
mixSignal: "logs:70,metrics:20,traces:10"
mixProduct: "claude-code:50,codex:50"
gzip: true

# 필수. backend 커밋마다 만든 코드 ConfigMap(loadtest-k6-<sha>). 키는 아래 scripts 표의 key 다.
configMapName: ""
# 캠페인 Secret. 키 seed-secret(32바이트)·identities.json(seed_sql.py --identities-out).
seedSecretName: loadtest-seed

# 클러스터 안 Service. ALB·WAF 를 거치지 않는다.
gatewayUrl: http://telemetry-gateway.pulsemetry-dev.svc:8082
enrollmentUrl: http://enrollment-api.pulsemetry-dev.svc:8080

# 없으면 계획 시간 + 600초. 주면 그보다 작을 수 없다.
activeDeadlineSeconds: null

# digest 고정 필수. helm/dev/loadtest/tests/arm64-images.json 의 증거와 같은 값이다.
images:
  k6: docker.io/grafana/k6:1.8.2@sha256:bd6ae8607c0a05d0dc0dc3f5753c464b0929baf083ef0f20b7eed845a3d9e6b4
  collector: docker.io/otel/opentelemetry-collector:0.161.0@sha256:b6d2b9a85b1029d05b5ad913150c1f014eed4ae99be81a1813ca5ade4a191913

resources:
  k6:
    requests: {cpu: "1", memory: 1Gi}
    limits: {cpu: "2", memory: 2Gi}
  collector:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 256Mi}

# /tmp(HOME) 크기 상한. k6 는 결과 파일을 쓰지 않는다 — summary 는 stdout 이다.
tmpSizeLimit: 64Mi
