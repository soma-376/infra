{{- if ne .Release.Namespace "pulsemetry-dev" }}
{{- fail "runtime release namespace는 pulsemetry-dev여야 한다" }}
{{- end }}
{{- include "pulsemetry.runtime.oidc.validate" . }}
{{- $region := required "region은 CDK EksRegion output이 필요하다" .Values.region }}
{{- $db := required "secrets.dbArn은 기존 DB Secret ARN이 필요하다" .Values.secrets.dbArn }}
{{- $hash := required "secrets.tokenHashArn은 기존 HMAC Secret ARN이 필요하다" .Values.secrets.tokenHashArn }}
{{- $admin := required "secrets.adminApiTokenArn은 기존 관리자 Secret ARN이 필요하다" .Values.secrets.adminApiTokenArn }}
{{- range $app := list "enrollment-api" "telemetry-ingest" }}
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ $app }}-runtime
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ $app }}
    app.kubernetes.io/part-of: pulsemetry
spec:
  provider: aws
  parameters:
    region: {{ $region | quote }}
    usePodIdentity: "true"
    preferredAddressType: ipv4
    objects: |
      - objectName: {{ $db | quote }}
        objectType: secretsmanager
        objectAlias: _source_db_json
        filePermission: "0400"
        jmesPath:
          - path: username
            objectAlias: PULSEMETRY_DB_USERNAME
            filePermission: "0444"
          - path: password
            objectAlias: PULSEMETRY_DB_PASSWORD
            filePermission: "0444"
      - objectName: {{ $hash | quote }}
        objectType: secretsmanager
        objectAlias: PULSEMETRY_TOKEN_HASH_SECRET
        filePermission: "0444"
{{- if eq $app "enrollment-api" }}
      - objectName: {{ $admin | quote }}
        objectType: secretsmanager
        objectAlias: _source_admin_json
        filePermission: "0400"
        jmesPath:
          - path: token
            objectAlias: PULSEMETRY_ADMIN_API_TOKEN
            filePermission: "0444"
{{- range $purpose, $key := $.Values.encryption }}
      - objectName: {{ $key.secretArn | quote }}
        objectType: secretsmanager
        objectVersion: {{ $key.versionId | quote }}
        objectAlias: {{ ternary "PULSEMETRY_MANAGEMENT_RESPONSE_ENCRYPTION_KEY" "PULSEMETRY_MAIL_ENCRYPTION_KEY" (eq $purpose "management") | quote }}
        filePermission: "0444"
{{- end }}
{{- if $.Values.oidc.enabled }}
{{- range $.Values.oidc.clients }}
      - objectName: {{ .secretArn | quote }}
        objectType: secretsmanager
        objectVersion: {{ .versionId | quote }}
        objectAlias: {{ .alias | quote }}
        filePermission: "0444"
{{- end }}
{{- end }}
{{- end }}
{{- end }}
