# scripts/perf-values.ts가 CDK outputs와 프로필에서 generated/platform.yaml로 만든다. 고정 계정·리소스 ID를 저장하지 않는다.
environmentId: ""
nodeRoleName: ""
availabilityZone: ""
subnetIds: []
nodeSecurityGroupId: ""
# pool id → securityGroupId·instanceType·nodes·dedicated·ephemeralStorageGiB (profiles/perf/<id>.json)
pools: {}
clickhouseStorage:
  iops: 3000
  throughputMiBps: 125
# 측정 중 drift 교체를 막는다. 만료·강제 interruption·수동 삭제·static scale은 막지 못한다(PLAN §4.1).
disruptionBudgetNodes: "0"
