# 독립 Fluent Bit release / namespace pulsemetry-perf-logs / SA fluent-bit. helm/dev/runtime과 같은 고정 chart·image다.
# generator 노드에는 두지 않는다. runner 로그는 console.log로 evidence에 남고 요청별 journal을 CloudWatch에 중복 전송하지 않는다(PLAN §4.2).
kind: DaemonSet
image:
  repository: cr.fluentbit.io/fluent/fluent-bit
  tag: "5.1.3"
  # multi-arch index digest. 관측 차트 Events collector와 같은 값이다(helm/observability/tests/fixtures/arm64-images.json).
  digest: sha256:c5542543523c9678398dd78d927c05e8425ec15b038f226b67b3b019b1a70845
testFramework:
  enabled: false
serviceAccount:
  create: true
  name: fluent-bit
  annotations: {}
rbac:
  create: true
  nodeAccess: false
nodeSelector:
  kubernetes.io/os: linux
  kubernetes.io/arch: arm64
tolerations:
  - key: workload
    operator: Equal
    value: gateway
    effect: NoSchedule
  - key: workload
    operator: Equal
    value: pipeline
    effect: NoSchedule
  - key: workload
    operator: Equal
    value: clickhouse
    effect: NoSchedule
  - key: workload
    operator: Equal
    value: observability
    effect: NoSchedule
  - key: CriticalAddonsOnly
    operator: Exists
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi
securityContext:
  runAsUser: 0
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
env:
  - name: AWS_REGION
    value: ap-northeast-2
  - name: APPLICATION_LOG_GROUP
    value: /eks/perf/application
  - name: OBSERVABILITY_LOG_GROUP
    value: /eks/perf/observability
  - name: CLUSTER_NAME
    value: soma-376-perf-eks
daemonSetVolumes:
  - name: varlog
    hostPath:
      path: /var/log
  - name: state
    hostPath:
      path: /var/log/fluent-bit-state
      type: DirectoryOrCreate
daemonSetVolumeMounts:
  - name: varlog
    mountPath: /var/log
    readOnly: true
  - name: state
    mountPath: /var/fluent-bit/state
    readOnly: false
config:
  service: |
    [SERVICE]
        Daemon Off
        Flush 5
        Log_Level info
        Parsers_File /fluent-bit/etc/parsers.conf
        HTTP_Server On
        HTTP_Listen 0.0.0.0
        HTTP_Port 2020
        Health_Check On
        storage.path /var/fluent-bit/state/buffer
        storage.sync normal
        storage.checksum On
        storage.backlog.mem_limit 10M
        storage.max_chunks_up 16
        storage.metrics On
  inputs: |
    [INPUT]
        Name tail
        Path /var/log/containers/*_pulsemetry-perf_*.log,/var/log/containers/*_pulsemetry-observability_*.log,/var/log/containers/*_pulsemetry-perf-logs_*.log
        DB /var/fluent-bit/state/tail.db
        DB.Sync Normal
        Buffer_Max_Size 256k
        storage.type filesystem
        Tag kube.*
        multiline.parser docker, cri
        Mem_Buf_Limit 10MB
        Skip_Long_Lines On
        Read_From_Head On
        Refresh_Interval 5
  filters: |
    [FILTER]
        Name kubernetes
        Match kube.*
        Kube_Tag_Prefix kube.var.log.containers.
        Merge_Log Off
        Keep_Log On
        Labels On
        Annotations Off
        K8S-Logging.Parser Off
        K8S-Logging.Exclude Off
    [FILTER]
        Name grep
        Match kube.*
        Regex $kubernetes['namespace_name'] ^(pulsemetry-perf|pulsemetry-observability|pulsemetry-perf-logs)$
    [FILTER]
        Name record_modifier
        Match kube.*
        Record environment perf
        Record cluster ${CLUSTER_NAME}
    [FILTER]
        Name rewrite_tag
        Match kube.*
        Rule $kubernetes['namespace_name'] ^pulsemetry-perf$ application.$TAG false
        Rule $kubernetes['namespace_name'] ^(pulsemetry-observability|pulsemetry-perf-logs)$ observability.$TAG false
        Emitter_Storage.type filesystem
  outputs: |
    [OUTPUT]
        Name cloudwatch_logs
        Match application.*
        region ${AWS_REGION}
        log_group_name ${APPLICATION_LOG_GROUP}
        log_stream_prefix from-fluent-bit-
        auto_create_group Off
        Retry_Limit False
        storage.total_limit_size 512M
    [OUTPUT]
        Name cloudwatch_logs
        Match observability.*
        region ${AWS_REGION}
        log_group_name ${OBSERVABILITY_LOG_GROUP}
        log_stream_prefix from-fluent-bit-
        auto_create_group Off
        Retry_Limit False
        storage.total_limit_size 128M
  customParsers: |
    # 이미지의 기본 docker/cri parser를 사용한다.
