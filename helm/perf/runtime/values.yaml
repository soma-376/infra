# scripts/perf-values.ts가 CDK output 참조로 generated/runtime.yaml을 만든다. Secret 값을 넣지 않는다.
region: ap-northeast-2
secrets:
  dbArn: ""
  tokenHashArn: ""
  adminApiTokenArn: ""
  telemetryJwtPrivateKeyArn: ""
  telemetryJwtPublicKeysArn: ""
  syntheticSeedArn: ""
  seedDbArn: ""
  verifyDbArn: ""
# 첫 bootstrap에서 운영자가 등록한 telemetry JWT 버전·kid·파일 맵이다. 일반 재배포에서 키를 새로 만들지 않는다.
telemetryJwt:
  privateVersionId: ""
  publicVersionId: ""
  activeKid: ""
  publicKeys: []
